  - ma: DT1
    slug: do-thai-giao-1
    slug_en: judaism-1
    nhom: do-thai-giao
    ten: "Torah, Shabbat và Đạo đức Tổ phụ"
    ten_en: "Torah, Shabbat and the Ethics of the Fathers"
    mo_ta: "Shema, lời \"Hãy nghe\" (Phục truyền 6:4–9); yêu người lân cận và người ngoại kiều (Lê-vi 19:17–18, 33–34; Hillel, Shabbat 31a); hai lý do của ngày Shabbat (Sáng thế 2:1–3, Phục truyền 5:12–15); ba câu hỏi của Hillel (Pirkei Avot I,14); \"không phải làm xong, nhưng không được bỏ\" của thầy Tarfon (Pirkei Avot II); công bằng, nhân hậu, khiêm tốn (Mi-chê 6:6–8). Chỉ mô tả luật và nghi lễ; bài tập là việc trong đời thường: đọc chậm, một việc tử tế, một khoảng nghỉ có chủ ý, làm ngay việc đã hoãn, mười phút cho việc dài hạn."
    mo_ta_en: "The Shema, \"Hear\" (Deuteronomy 6:4–9); loving the neighbour and the stranger (Leviticus 19:17–18, 33–34; Hillel, Shabbat 31a); the two reasons for Shabbat (Genesis 2:1–3, Deuteronomy 5:12–15); Hillel's three questions (Pirkei Avot I, 14); Rabbi Tarfon's \"not to finish, but not to quit\" (Pirkei Avot II); justice, kindness, humility (Micah 6:6–8). Law and ritual are only described; the exercises are everyday actions: slow reading, one kindness, one intentional rest period, doing something put off, ten minutes on a long-term task."
    tang: "1"
    phut: "10–15"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 6 tuần"
    tien_do_en: "All 6 weeks published"
