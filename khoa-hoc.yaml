    bai:
      - "Ngồi với hơi thở | Sitting with the breath | MN 118 (đoạn 15–18) || MN 118 (sections 15–18) | Ngồi 10 phút ≥5/7 ngày | Sit 10 minutes on 5 of 7 days"
      - "Bốn sự thật bằng lời mình | The four truths in your own words | SN 56.11 | Viết lại 4 ý trong ≤4 câu; khung bốn câu hỏi ≥5/7 ngày | Rewrite the four points in at most four sentences; use the four-question frame on 5 of 7 days"
