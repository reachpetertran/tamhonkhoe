    bai:
      - "Một người ngay thẳng | An upright man | Gióp 1:1, 1:20–22, 2:11–13 || Job 1:1, 1:20–22, 2:11–13 | Đọc và ngồi 25′ ≥5/7; ghi 1 câu hỏi/tối ≥5/7 | Read and sit 25′ on 5 of 7 days; write one question each evening on 5 of 7 evenings"
      - "Gióp lên tiếng | Job speaks out | Gióp 7:11, 23:3–4, 23:8–9 || Job 7:11, 23:3–4, 23:8–9 | Viết lời than 10′ ≥3 ngày; đọc và ngồi đủ buổi ≥5/7 | Write a 10′ lament on at least 3 days; a full session on 5 of 7 days"
      - "Những người bạn | The friends | Gióp 4:3–8, 16:2–5 || Job 4:3–8, 16:2–5 | Ngồi 25′ ≥5/7; nghe 3′ không khuyên ≥5/7 | Sit 25′ on 5 of 7 days; listen 3′ without advice on 5 of 7 days"
      - "Tiếng nói từ cơn gió lốc | The voice from the whirlwind | Gióp 38:1–7 || Job 38:1–7 | Đi bộ 15′ ≥3 lần; đọc và ngồi (hoặc đi) ≥5/7 | Walk 15′ at least 3 times; read and sit (or walk) on 5 of 7 days"
      - "Lời đáp của Gióp | Job’s reply | Gióp 42:1–6 || Job 42:1–6 | Ngồi 30′ ≥5/7; 1 buổi đọc cùng 1 người trong tuần | Sit 30′ on 5 of 7 days; read with one person once in the week"
      - "Ôn tập: cầu nguyện cho bạn, ăn bánh cùng nhau | Review: praying for friends, eating bread together | Gióp 42:7, 42:10–11 || Job 42:7, 42:10–11 | Tự chấm 6 thói quen, giữ 2, kế hoạch 4 tuần; 1 lần thăm hỏi | Rate six habits, keep two, write a 4-week plan; one visit or check-in"
    gioi_han: "Khóa Tầng 3 về khổ đau và mất mát: mỗi ngày 30–40 phút, nên học sau Do Thái giáo 1 và 2. Không dành cho người đang trầm cảm, vừa mất người thân (nhất là mất con), đang bệnh nặng hay đang có ý nghĩ muốn chết; người từng có loạn thần, rối loạn lưỡng cực hay PTSD nặng không nên tự học. Khóa mô tả cách sách Gióp kể và vài cách truyền thống Do Thái đọc sách này; khóa không giải thích vì sao một người cụ thể phải khổ, không nói khổ đau là hình phạt hay phần thưởng, không đọc phần kết như lời hứa đền bù, và không so sánh với các truyền thống khác. Khóa không trích chương 3 (Gióp nguyền rủa ngày sinh) và câu 7:16. Bài viết lời than, đi bộ và đọc cùng một người là cách làm của tamhonkhoe, không phải nghi lễ của truyền thống. Talmud (Bava Batra 15a–16b, Moed Katan 28b) chỉ tóm ý. Bản Việt là bản tamhonkhoe tự dịch từ JPS 1917, không dịch từ tiếng Hebrew; trang tiếng Anh chép nguyên văn bản JPS. Góc trẻ chỉ nói về ngày khó nhỏ, không nói về cái chết, bệnh tật hay mất mát. Chưa có người duyệt từ trong truyền thống Do Thái, và chưa có nghiên cứu đánh giá trực tiếp chương trình này."
    gioi_han_en: "A Level 3 course on suffering and loss: 30–40 minutes a day, best taken after Judaism 1 and 2. It is not for people who are depressed, recently bereaved (especially of a child), seriously ill or having thoughts of dying; people with a history of psychosis, bipolar disorder or severe PTSD should not study it alone. It describes what the Book of Job tells and some ways the Jewish tradition reads it; it does not explain why any particular person suffers, does not say that suffering is a punishment or a reward, does not read the ending as a promise of repayment, and does not compare with other traditions. It does not quote chapter 3 (Job cursing the day of his birth) or verse 7:16. The lament writing, walking and reading with someone are tamhonkhoe’s own exercises, not rituals of the tradition. The Talmud (Bava Batra 15a–16b, Moed Katan 28b) is only summarised. The Vietnamese is tamhonkhoe’s own translation from JPS 1917, not from Hebrew; the English pages quote JPS word for word. The kids’ corner is only about small hard days, never death, illness or loss. No reviewer from within the Jewish tradition has checked it yet, and no study has evaluated this programme directly."

  - ma: DT4
    slug: do-thai-giao-4
    slug_en: judaism-4
    nhom: do-thai-giao
    ten: "Shabbat trong gia đình"
    ten_en: "Shabbat in the family"
    mo_ta: "Khóa Tầng 4 đưa ba điều của truyền thống Do Thái vào nhịp sống gia đình: ngày nghỉ, việc cho người nghèo (tzedakah) và bàn ăn chung. Đọc ngày sa-bát là dấu hiệu và niềm vui (Xuất hành 31:16–17, Ê-sai 58:13–14), ngày nghỉ cho cả người làm (Xuất hành 23:12), mở tay cho người túng thiếu (Phục truyền 15:7–11) cùng tám bậc cho đi của Maimonides (tóm ý), chừa góc ruộng và bó lúa bỏ quên (Lê-vi 19:9–10, Phục truyền 24:19), ngôi nhà mở cửa (Pirkei Avot I,5), và bài ca cho ngày sa-bát (Thi thiên 92). Bài tập là việc của một gia đình bất kỳ: một buổi nghỉ chung có chuẩn bị trước, chia lại việc nhà, một hộp chia sẻ, chừa phần cho người khác, bữa ăn không màn hình và mời khách."
    mo_ta_en: "A Level 4 course bringing three things from the Jewish tradition into family life: the day of rest, giving to the poor (tzedakah) and the shared table. Readings: the sabbath as a sign and a delight (Exodus 31:16–17, Isaiah 58:13–14), rest for workers too (Exodus 23:12), opening your hand to the needy (Deuteronomy 15:7–11) with Maimonides' eight levels of giving (summarised), the corner of the field and the forgotten sheaf (Leviticus 19:9–10, Deuteronomy 24:19), the open house (Pirkei Avot I, 5), and the song for the sabbath day (Psalm 92). The exercises are for any family: a shared rest period prepared in advance, sharing housework again, a sharing box, setting something aside for others, meals without screens and inviting guests."
    tang: "4"
    phut: "Theo nhịp sống"
    phut_en: "Fits daily life"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 6 tuần"
    tien_do_en: "All 6 weeks published"
    duyet: chu-du-an
    ra_mat: "Th11/2026"
    ra_mat_en: "Nov 2026"
