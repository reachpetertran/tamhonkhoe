      - "Yom Kippur | Yom Kippur | Lê-vi Ký 16:29–31 · Ê-sai 58:6–7 || Leviticus 16:29–31 · Isaiah 58:6–7 | Đọc ≥5/7; sửa xong 1 lỗi nhỏ với người khác | Read on 5 of 7 days; put right one small wrong done to someone"
      - "Mùa Chay | Lent | Ma-thi-ơ 4:1–2 · 6:16–18 || Matthew 4:1–2 · 6:16–18 | Đọc ≥5/7; ≥2 việc tốt kín đáo | Read on 5 of 7 days; at least 2 good deeds in secret"
      - "Bát quan trai và ôn tập | The eight precepts and review | AN 8.41 | 1 buổi tối không giải trí; điền bảng so sánh; giữ ≥1 thực hành | One evening without entertainment; complete the comparison table; keep at least one practice"
    gioi_han: "Khóa chỉ mô tả, không hướng dẫn nhịn ăn và không mời ai nhịn theo. Ai đang giữ chay theo đức tin của mình nên hỏi lãnh đạo tôn giáo về luật và hỏi bác sĩ về sức khỏe, nhất là khi có bệnh mạn tính, đái tháo đường đang dùng thuốc, đang mang thai hay cho con bú, tiền sử tâm thần phân liệt hay rối loạn lưỡng cực. Ai đang có hoặc từng có rối loạn ăn uống nên bàn với bác sĩ trước khi đọc. Phần mô tả tập quán của từng truyền thống là đánh giá của người viết, chưa có người duyệt từ trong các truyền thống. Chưa có nghiên cứu tổng hợp về Yom Kippur, Mùa Chay hay bát quan trai; nghiên cứu về Ramadan khó có nhóm chứng thật sự."
    gioi_han_en: "The course only describes; it does not teach fasting or invite anyone to fast. Anyone who fasts as part of their faith should ask their religious leaders about the rules and a doctor about their health, especially with a chronic illness, diabetes treated with medication, pregnancy or breastfeeding, or a history of schizophrenia or bipolar disorder. Anyone with a current or past eating disorder should talk to a doctor before reading. The descriptions of each tradition's practice are the writer's judgement and have not yet been reviewed by people within the traditions. There are no reviews on Yom Kippur, Lent or the eight precepts; studies of Ramadan can hardly have a true control group."

