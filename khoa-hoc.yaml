    nghien_cuu: [goyal2014, khoury2015, vandam2018, farias2020, hilton2017, gloster2020, wei2025, abramowitz2001, kuyken2016]
    bai_tep: [khe/phat-giao/pg2-tuan-01, khe/phat-giao/pg2-tuan-02, khe/phat-giao/pg2-tuan-03, khe/phat-giao/pg2-tuan-04, khe/phat-giao/pg2-tuan-05, khe/phat-giao/pg2-tuan-06, khe/phat-giao/pg2-tuan-07, khe/phat-giao/pg2-tuan-08]
    bai:
      - "Niệm thân (1): hơi thở | Mindfulness of the body (1): the breath | MN 10 (đoạn 2–5) || MN 10 (sections 2–5) | Ngồi ≥15 phút 5/7 ngày, trong đó ≥3 ngày 20 phút | Sit at least 15 minutes on 5 of 7 days, with at least 3 days at 20 minutes"
      - "Niệm thân (2): tư thế, tỉnh giác, tứ đại | Mindfulness of the body (2): postures, awareness, elements | MN 10 (đoạn 6, 8, 12) || MN 10 (sections 6, 8, 12) | Đi chậm 10′ + ngồi 15′ ≥5/7; 1 việc thường ngày trong tỉnh giác ≥5/7 | Slow walking 10′ + sitting 15′ on 5 of 7 days; one routine task with awareness on 5 of 7 days"
      - "Niệm thọ | Mindfulness of feelings | MN 10 (đoạn 32–33) || MN 10 (sections 32–33) | Ngồi 20′ ≥5/7; gọi tên cảm thọ 3 lần/ngày ≥5/7 | Sit 20′ on 5 of 7 days; name the feeling tone 3 times a day on 5 of 7 days"
      - "Mũi tên thứ hai | The second arrow | SN 36.6 | Ngồi 25′ ≥5/7; ghi 1 cặp mũi tên/ngày ≥5/7 | Sit 25′ on 5 of 7 days; write one pair of arrows a day on 5 of 7 days"
      - "Niệm tâm | Mindfulness of mind | MN 10 (đoạn 34–35) || MN 10 (sections 34–35) | Ngồi 25′ ≥5/7; 1 dòng \"thời tiết của tâm\" mỗi tối ≥5/7 | Sit 25′ on 5 of 7 days; one line of ‘mind weather’ each evening on 5 of 7 days"
      - "Niệm pháp: năm triền cái | Mindfulness of principles: the five hindrances | MN 10 (đoạn 36) || MN 10 (section 36) | Ngồi ≥25′ 5/7; cuối tuần ghi triền cái ghé nhiều nhất và cách làm nó lắng | Sit at least 25′ on 5 of 7 days; at week’s end, note the most frequent hindrance and what helped it settle"
      - "Thay ý nghĩ | Replacing thoughts | MN 20 | Ngồi ≥25′ 5/7; ghi ≥3 lần đã thử bốn cách | Sit at least 25′ on 5 of 7 days; record at least 3 times you tried the four approaches"
      - "Hai loại ý nghĩ và ôn tập | Two kinds of thought, and review | MN 19 | Ngồi 30′ ≥5/7; tự chấm 8 tuần và viết kế hoạch 4 tuần | Sit 30′ on 5 of 7 days; complete the 8-week self-rating and a 4-week plan"
    gioi_han: "Khóa Tầng 2: mỗi ngày ngồi 20–30 phút, nên học sau Phật giáo 1. Thiền dài hơn có thể gây trải nghiệm khó chịu; mỗi bài có mục \"Dừng tập khi\", và người từng có loạn thần, rối loạn lưỡng cực hay PTSD nặng nên hỏi bác sĩ trước. Khóa không tập quán 31 bộ phận của thân, quán tử thi (MN 10) và cách thứ năm \"dùng tâm khống chế tâm\" (MN 20). Khóa trình bày phần thực hành, không đòi người học chấp nhận niềm tin về tái sinh hay các tầng chứng đắc. Chưa có người duyệt từ trong truyền thống Phật giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này."
    gioi_han_en: "A Level 2 course: 20–30 minutes of sitting a day, best taken after Buddhism 1. Longer meditation can bring difficult experiences; every lesson has a ‘Stop practising if’ section, and people with a history of psychosis, bipolar disorder or severe PTSD should ask a doctor first. The course does not practise contemplating the 31 parts of the body or corpses (MN 10), or the fifth approach of ‘crushing mind with mind’ (MN 20). It presents the practice and does not ask learners to accept beliefs about rebirth or stages of attainment. No reviewer from within the Buddhist tradition has checked it yet, and no study has evaluated this programme directly."

  - ma: PG3
    slug: phat-giao-3
    slug_en: buddhism-3
    nhom: phat-giao
    ten: "Vô thường, vô ngã"
    ten_en: "Impermanence and not-self"
    mo_ta: "Năm uẩn, bọt nước, chiếc bè và Kinh Pháp môn căn bản; ngồi 30–45 phút mỗi ngày. Góc trẻ chỉ nói về thay đổi."
    mo_ta_en: "The five aggregates, the lump of foam, the raft and the discourse on the root of all things; 30–45 minutes a day. The kids’ corner is only about change."
    tang: "3"
    phut: "30–45"
    trang_thai: dang-mo
