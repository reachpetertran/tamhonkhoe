      - "Những vòng tròn quan tâm | The circles of concern | Hierocles (bản Taylor) · Suy tưởng VI.44 || Hierocles (Taylor) · Meditations VI.44 | 1 việc nhỏ cho người ở vòng ngoài/ngày, ≥5/7 | One small thing a day for someone in an outer circle, on 5 of 7 days"
      - "Ôn tập | Review | Suy tưởng V.1, VI.39 || Meditations V.1, VI.39 | Tự chấm 5 thói quen, giữ 2, ≥5/7 | Rate five habits, keep two, on 5 of 7 days"
    gioi_han: "Giận dữ cấp tính và kỹ năng hạ nhiệt nhanh có trang gốc trên daynentang.com; ở đây chỉ đặt link. Khóa không theo các ý trong kinh văn về làm việc quên ăn quên ngủ, về cách đối xử với nô lệ thời La Mã, hay về chịu đựng người cha đánh đập; không bài tập nào dành cho hoàn cảnh có bạo lực, đe dọa hay quấy rối. Chưa có nghiên cứu đánh giá trực tiếp chương trình này."
    gioi_han_en: "Acute anger and quick calming skills have their home on daynentang.com; we only link there. The course does not follow the passages about working without eating or sleeping, the treatment of slaves in Roman times, or submitting to a father who strikes you; no exercise is meant for situations involving violence, threats or harassment. No study has evaluated this programme directly."

