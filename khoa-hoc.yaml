      - "Thắng chính mình | Overcoming oneself | Đạo Đức Kinh 33 || Tao Te Ching 33 | Giữ 1 việc nhỏ ≥6/7 ngày | Keep one small task on 6 of 7 days"
      - "Ba báu vật | Three treasures | Đạo Đức Kinh 67 || Tao Te Ching 67 | Tập 1 trong 3 báu vật (hiền hòa, tiết kiệm, không tranh trước) ≥5/7 | Practise one of the three treasures (gentleness, economy, not taking precedence) on 5 of 7 days"
      - "Đầu bếp Đinh và ôn tập | Cook Ding and review | Trang Tử III || Zhuangzi III | Làm chậm 1 việc quen ≥5/7; tự chấm 6 thói quen, giữ 2 | Do one familiar task slowly on 5 of 7 days; rate six habits, keep two"
    gioi_han: "Khóa đọc văn bản Đạo gia, không dạy nghi lễ hay phép tu luyện của Đạo giáo. Bản Việt là bản tamhonkhoe tự dịch từ James Legge (1891) và Herbert Giles (1889); chưa đối chiếu với nguyên văn Hán. Khóa bỏ đoạn 1 chương 67 vì đoạn ấy so Đạo với các học thuyết khác. \"Không tranh\" và \"nhường\" không có nghĩa là chịu bị hại; \"tiết kiệm\" không phải lời khuyên tài chính. Chưa có người duyệt từ trong truyền thống Đạo giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; khoa học trong bài chỉ là bằng chứng gần."
    gioi_han_en: "The course reads Taoist texts; it does not teach Taoist ritual or cultivation methods. The Vietnamese is tamhonkhoe's own translation from James Legge (1891) and Herbert Giles (1889), not yet checked against the Chinese original. The course leaves out paragraph 1 of chapter 67 because it compares the Tao with other teachings. \"Not striving\" and \"yielding\" do not mean accepting harm; \"economy\" is not financial advice. No reviewer from within the Taoist tradition has checked it yet, and no study has evaluated this programme directly; the science in the lessons is only nearby evidence."

  - ma: DG2
    slug: dao-giao-2
    slug_en: taoism-2
    nhom: dao-giao
    ten: "Vô vi trong thực hành"
    ten_en: "Non-action in practice"
    mo_ta: "Đạo Đức Kinh chương 2, 11, 22, 48, 37, 63, 43 và hai chuyện trong Trang Tử chương IV (\"tâm trai\", cây lịch); mỗi ngày ngồi 20–30 phút và một việc nhỏ: bớt, nghe, không ép. \"Tâm trai\" là nhịn của tâm, không phải nhịn ăn."
    mo_ta_en: "Tao Te Ching chapters 2, 11, 22, 48, 37, 63 and 43, and two stories from Zhuangzi chapter IV (‘fasting of the mind’, the li tree); each day 20–30 minutes of sitting and one small action: doing less, listening, not forcing. ‘Fasting of the mind’ is of the mind, not of the body."
