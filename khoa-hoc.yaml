    bai:
      - "Lòng an bình khi tưởng nhớ | Hearts at rest in remembrance | Qur'an 13:28 | Đọc ≥5/7; ngồi im 10 phút ≥5/7; 1 nhịp dừng giữa ngày ≥5/7 | Read on 5 of 7 days; sit still 10 minutes on 5 of 7 days; one midday pause on 5 of 7 days"
