      - "Đời sống tại gia an lạc | A good lay life | AN 8.54 · DN 31 | Làm xong 1 việc đã chọn ≥5/7; 1 cuộc trò chuyện với bạn tốt | Finish one chosen task on 5 of 7 days; one conversation with a good friend"
      - "Soi lại việc mình làm | Reflecting on our actions | MN 61 | Soi 3 lần 1 việc/ngày ≥5/7; ghi ≥2 việc tốt | Check one action three times a day on 5 of 7 days; note at least 2 good deeds"
      - "Vợ chồng đồng hành | Partners together | AN 4.55 | 1 lời cảm ơn cụ thể ≥5/7; 1 buổi nói chuyện 20′ | One specific thank-you on 5 of 7 days; one 20′ conversation"
