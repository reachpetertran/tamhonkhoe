    bai:
      - "Dậy để làm việc của người | Rising to do human work | Suy tưởng V.1 || Meditations V.1 | Gọi tên 1 \"việc của người\" mỗi sáng + nghỉ ≥30 phút mỗi tối, ≥5/7 | Name one piece of ‘human work’ each morning and take 30 minutes off each evening, on 5 of 7 days"
