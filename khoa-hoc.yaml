    bai:
      - "Người chăn | The shepherd | Thi thiên 23 || Psalm 23 | Đọc chậm 10 phút theo bốn bước ≥5/7 | Slow reading for 10 minutes in four steps on 5 of 7 days"
      - "Các mối phúc | The Beatitudes | Mt 5:3–9 || Matthew 5:3–9 | Đọc ≥5/7; ghi 1 dòng sau mỗi lần đọc | Read on 5 of 7 days; write one line after each reading"
      - "Kinh Lạy Cha (mô tả) | The Lord’s Prayer (described) | Mt 6:9–13 || Matthew 6:9–13 | Đọc và ghi 1 dòng ≥5/7; đọc thành lời cầu là tùy chọn | Read and note one line on 5 of 7 days; praying it is optional"
      - "Người Samari nhân hậu | The Good Samaritan | Lc 10:25–37 || Luke 10:25–37 | Đọc ≥5/7; 1 việc giúp người lạ trong tuần, trong giới hạn an toàn | Read on 5 of 7 days; one act of help to a stranger in the week, within safe limits"
      - "Đừng lo lắng | Do not worry | Mt 6:25–34 || Matthew 6:25–34 | Đọc ≥5/7; 1 lần viết 3 nỗi lo, tách \"hôm nay\"/\"ngày mai\", đọc lại câu 34 | Read on 5 of 7 days; once, write three worries, sort \"today\"/\"tomorrow\", reread verse 34"
      - "Tình yêu là gì (và ôn tập) | What love is (and review) | 1 Cr 13:4–7 || 1 Corinthians 13:4–7 | Tập 1 đức tính ≥5/7; tự chấm 6 thói quen, giữ 2, kế hoạch 4 tuần | Practise one quality on 5 of 7 days; rate six habits, keep two, write a 4-week plan"
    gioi_han: "Khóa Tầng 1: mỗi ngày khoảng 12–15 phút. Khóa mô tả và tập cách đọc chậm của truyền thống Kitô giáo; người học không cần theo đạo, và bước \"đáp lời\" có cách cho người không cầu nguyện (viết một câu đáp lại), là điều chỉnh của tamhonkhoe chứ không phải hình thức của truyền thống. Bản Việt dùng nguyên văn bản Kinh Thánh 1925 (Tin Lành), chỉ sửa vài chữ bị lỗi mã hóa trong tệp điện tử và có ghi rõ; người Công giáo quen một bản dịch khác. Bài 3 không mời ai cầu nguyện theo một niềm tin mình không có. Câu \"tha\" và \"nín chịu mọi sự\" không dùng cho tổn thương do bạo lực, xâm hại hay kiểm soát. Bài 5 không thay cho điều trị lo âu, và không phải lời khuyên tài chính hay y tế. Chưa có người duyệt từ trong truyền thống Kitô giáo, và chưa có nghiên cứu tổng hợp riêng về lectio divina; bằng chứng trong bài chỉ là gián tiếp."
    gioi_han_en: "A Level 1 course: about 12–15 minutes a day. The course describes and practises the Christian tradition’s way of slow reading; learners do not need to be Christian, and the ‘response’ step offers an option for those who do not pray (writing one sentence in response), which is tamhonkhoe’s adaptation rather than a form of the tradition. The English pages quote the World English Bible. Lesson 3 does not invite anyone to pray in a faith they do not hold. The lines on forgiving and ‘enduring all things’ are not for harm from violence, abuse or control. Lesson 5 is not a treatment for anxiety, nor financial or medical advice. No reviewer from within the Christian tradition has checked it yet, and there is no review of lectio divina itself; the evidence in the lessons is only indirect."

