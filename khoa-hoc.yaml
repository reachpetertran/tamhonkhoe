      - "Nơi ẩn náu bên trong | The inner retreat | Suy tưởng IV.3 || Meditations IV.3 | ≥3 lần lui vào trong/ngày, ≥5/7 | At least three inner retreats a day, on 5 of 7 days"
      - "Đọc ít mà sâu | Reading a few books deeply | Seneca, Thư 2 || Seneca, Letter 2 | Chép 1 câu + 1 dòng nhật ký, ≥5/7 | Copy one sentence and write one line, on 5 of 7 days"
      - "Tập thiếu thốn nhẹ | Practising mild hardship | Seneca, Thư 18 || Seneca, Letter 18 | 2 ngày giản dị/tuần; nhật ký ≥5/7 | Two simple days a week; journal on 5 of 7 evenings"
      - "Hành động vì cái chung | Acting for the common good | Suy tưởng VI.30 || Meditations VI.30 | 1 việc nhỏ cho người khác/ngày, ≥5/7 | One small act for someone a day, on 5 of 7 days"
      - "Bám chấp và mất mát | Attachment and loss | Bài giảng III.24 || Discourses III.24 | 1 điều \"được cho mượn\"/tối, ≥5/7 | One thing ‘on loan’ each evening, on 5 of 7"
