    bai_tep: [khe/dao-giao/dg3-tuan-01, khe/dao-giao/dg3-tuan-02, khe/dao-giao/dg3-tuan-03, khe/dao-giao/dg3-tuan-04, khe/dao-giao/dg3-tuan-05, khe/dao-giao/dg3-tuan-06]
    bai:
      - "Giấc mơ hóa bướm | The butterfly dream | Trang Tử II || Zhuangzi II | Ngồi 30′ ≥5/7; ghi 1 lần chuyển/tối ≥5/7 | Sit 30′ on 5 of 7 days; note one change each evening on 5 of 7 evenings"
      - "Khi vợ Trang Tử mất | When Zhuangzi’s wife died | Trang Tử XVIII || Zhuangzi XVIII | Ngồi 30′ ≥5/7; ghi 1 thay đổi trong tự nhiên/ngày ≥5/7 | Sit 30′ on 5 of 7 days; note one change in nature a day on 5 of 7 days"
      - "Biến hóa | Transformation | Trang Tử VI (bốn người bạn) || Zhuangzi VI (the four friends) | Ngồi 35′ quét thân ≥5/7; ghi 1 thay đổi nhỏ của thân/tối ≥5/7 | Sit 35′ with a body scan on 5 of 7 days; note one small change in the body each evening on 5 of 7 evenings"
      - "Lửa truyền sang củi khác | The fire passes on | Trang Tử III || Zhuangzi III | Buổi 40′ (hoặc 30′ ngồi + 10′ đi chậm) ≥5/7; 1 việc truyền lửa/ngày ≥5/7 | A 40′ session (or 30′ sitting + 10′ slow walking) on 5 of 7 days; one act of passing on the fire a day on 5 of 7 days"
      - "Đọc cùng một người | Reading with someone | Trang Tử VI (lò đúc lớn) || Zhuangzi VI (the great furnace) | Ngồi 40′ ≥5/7; 1 buổi đọc cùng 1 người trong tuần; 1 lần không đòi/ngày ≥5/7 | Sit 40′ on 5 of 7 days; read with one person once in the week; one moment of not demanding a day on 5 of 7 days"
      - "Ôn tập | Review | Trang Tử XXXII, III || Zhuangzi XXXII, III | Ngồi 30–40′ ≥5/7; tự chấm 6 thói quen, giữ 2, kế hoạch 4 tuần | Sit 30–40′ on 5 of 7 days; rate six habits, keep two, write a 4-week plan"
    gioi_han: "Khóa Tầng 3 về sống, chết và mất mát: mỗi ngày 30–45 phút, nên học sau Đạo giáo 1 và 2. Không dành cho người đang trầm cảm, có tang mới, bệnh nặng hay đang có ý nghĩ muốn chết; người có tang trong năm qua nên bỏ qua Tuần 2. Người từng có loạn thần, rối loạn lưỡng cực, PTSD nặng hay cảm giác tách khỏi bản thân kéo dài không nên tự học. Khóa không trích chuyện cái đầu lâu (chương XVIII) và câu Tử Lai nói về việc \"chết sớm\" (chương VI); khóa không chọn cách hiểu nào về đời sau và không theo các chú thích \"luân hồi\", \"linh hồn bất tử\" của Giles. Giles dịch Trời và Tạo Hóa thành \"God\"; bản Việt dịch theo nguyên văn Hán. Góc trẻ chỉ nói về thay đổi trong tự nhiên, không nhắc tới cái chết. Bản Việt là bản tamhonkhoe tự dịch từ Herbert Giles (1889), chưa đối chiếu với nguyên văn Hán. Chưa có người duyệt từ trong truyền thống Đạo giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này."
    gioi_han_en: "A Level 3 course on life, death and loss: 30–45 minutes a day, best taken after Taoism 1 and 2. It is not for people who are depressed, newly bereaved, seriously ill or having thoughts of dying; anyone bereaved in the past year should skip Week 2. People with a history of psychosis, bipolar disorder, severe PTSD or long-lasting feelings of being detached from themselves should not study it alone. The course does not quote the story of the skull (chapter XVIII) or Tzu Lai’s line about ‘dying quickly’ (chapter VI); it takes no position on any afterlife and does not follow Giles’s ‘metempsychosis’ and ‘immortal soul’ notes. Giles renders Heaven and the Creator as ‘God’; the Vietnamese follows the Chinese. The kids’ corner is only about change in nature and never mentions death. The Vietnamese is tamhonkhoe’s own translation from Herbert Giles (1889), not yet checked against the Chinese original. No reviewer from within the Taoist tradition has checked it yet, and no study has evaluated this programme directly."

  - ma: DG4
    slug: dao-giao-4
    slug_en: taoism-4
    nhom: dao-giao
    ten: "Đạo trong việc thường"
    ten_en: "The Way in ordinary things"
    mo_ta: "Chuyện người gù bắt ve, người thợ làm bánh xe, người chơi cược trong Trang Tử (chương XIX, XIII, III) và Đạo Đức Kinh chương 64, 44, 46, 54, 81, 9; mỗi ngày đọc vài phút rồi tập trong việc làm, việc nhà và gia đình: luyện từng phần nhỏ, lo việc khi còn nhỏ, biết đủ, cẩn thận lúc cuối, cho mà không giữ sổ."
    mo_ta_en: "The stories of the hunchback catching cicadas, the wheelwright and the gambler in the Zhuangzi (chapters XIX, XIII and III), and Tao Te Ching chapters 64, 44, 46, 54, 81 and 9; each day a few minutes of reading, then practice in work, housework and family life: practising small parts, dealing with things while small, knowing enough, care at the end, giving without keeping score."
    tang: "4"
    phut: "Theo nhịp sống"
    phut_en: "Fits daily life"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 6 tuần"
    tien_do_en: "All 6 weeks published"
    duyet: chu-du-an
    ra_mat: "Th11/2026"
    ra_mat_en: "Nov 2026"
    co_goc_tre: true
    nghien_cuu: [macnamara2014, gollwitzer2006, dittmar2014, wendsche2017, curry2018, friese2017]
    bai_tep: [khe/dao-giao/dg4-tuan-01, khe/dao-giao/dg4-tuan-02, khe/dao-giao/dg4-tuan-03, khe/dao-giao/dg4-tuan-04, khe/dao-giao/dg4-tuan-05, khe/dao-giao/dg4-tuan-06]
    bai:
      - "Tay nghề như dòng chảy | Skill as flow | Trang Tử XIX, XIII || Zhuangzi XIX, XIII | Luyện 1 phần nhỏ của kỹ năng 5–10′ ≥5/7 | Practise one small part of a skill for 5–10′ on 5 of 7 days"
      - "Ngàn dặm bắt đầu từ một bước | A journey of a thousand miles | Đạo Đức Kinh 64 || Tao Te Ching 64 | Lo 1 việc khi còn nhỏ/ngày ≥5/7; 1 câu \"nếu… thì…\" và bước đầu của 1 việc lớn | Deal with one thing while small a day on 5 of 7 days; one \"if… then…\" sentence and the first step of one big task"
      - "Biết đủ | Knowing enough | Đạo Đức Kinh 44, 46 || Tao Te Ching 44, 46 | 1 lần dừng \"đủ rồi\"/ngày ≥5/7; ghi 1 điều đã đủ mỗi tối ≥5/7 | One \"that's enough\" stop a day on 5 of 7 days; note one thing that was enough each evening on 5 of 7"
      - "Công việc | Work | Trang Tử XIX, Đạo Đức Kinh 64 || Zhuangzi XIX, Tao Te Ching 64 | 1′ đặt món cược xuống trước 1 việc quan trọng ≥5/7; 2′ kiểm bước cuối ≥5/7 | One minute putting the stake down before an important task on 5 of 7 days; two minutes checking the last step on 5 of 7"
      - "Gia đình | Family | Đạo Đức Kinh 54, 81 || Tao Te Ching 54, 81 | 1 việc không giữ sổ cho người trong nhà/ngày ≥5/7; 1 việc cả nhà làm chung/tuần | One act at home without keeping score a day on 5 of 7 days; one task together as a family in the week"
      - "Ôn tập | Review | Trang Tử III, Đạo Đức Kinh 9 || Zhuangzi III, Tao Te Ching 9 | Bớt 1 cam kết; tự chấm 6 thói quen, giữ 2, kế hoạch 4 tuần | Drop one commitment; rate six habits, keep two, write a 4-week plan"
    gioi_han: "Khóa Tầng 4: không có buổi ngồi dài, chỉ đọc vài phút mỗi ngày và tập trong việc làm, việc nhà, gia đình; nên học sau Đạo giáo 1. Khóa đọc văn bản Đạo gia, không dạy nghi lễ hay phép tu luyện của Đạo giáo. \"Biết đủ\" và \"không tích trữ\" không phải lời khuyên tài chính, không có nghĩa là chịu thiếu thốn hay không đòi quyền lợi chính đáng, và không dùng cho chuyện ăn uống; \"không giữ sổ\" không có nghĩa là một người gánh hết việc nhà; \"đặt món cược xuống\" không thay quy trình an toàn của nghề. Khóa không trích phần người lái đò \"xem lật thuyền như chuyện thường\" và các đoạn nói về chiến tranh, cúng tế. Chương 54 Legge dịch là \"của cải\", nguyên văn nói về \"đức\"; khóa không hứa giàu có. Bản Việt là bản tamhonkhoe tự dịch từ James Legge (1891) và Herbert Giles (1889), chưa đối chiếu với nguyên văn Hán. Chưa có người duyệt từ trong truyền thống Đạo giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; khoa học trong bài chỉ là bằng chứng gần."
    gioi_han_en: "A Level 4 course: no long sitting, just a few minutes of reading a day and practice in work, housework and family life; best taken after Taoism 1. The course reads Taoist texts; it does not teach Taoist ritual or cultivation methods. ‘Knowing enough’ and ‘not accumulating’ are not financial advice, do not mean accepting hardship or giving up fair rights, and are not about eating; ‘not keeping score’ does not mean one person carrying all the housework; ‘putting the stake down’ does not replace a trade’s safety procedures. The course does not quote the boatman who treats ‘an upset as an ordinary cart accident’, or the passages about war and sacrifices. In chapter 54 Legge writes ‘riches’ where the Chinese speaks of virtue; the course promises no wealth. The Vietnamese is tamhonkhoe’s own translation from James Legge (1891) and Herbert Giles (1889), not yet checked against the Chinese original. No reviewer from within the Taoist tradition has checked it yet, and no study has evaluated this programme directly; the science in the lessons is only nearby evidence."

  # ------------------------------------------------------------ THÂN THỂ
  - ma: TT1
    slug: than-the-1
    slug_en: body-1
    nhom: than-the
    ten: "Ăn chậm, ăn biết ơn"
    ten_en: "Eating slowly, eating gratefully"
    mo_ta: "Lời cảm ơn trước bữa ăn ở nhiều truyền thống, một bữa ăn chậm mỗi ngày, bữa không màn hình và lời cảm ơn người làm ra bữa ăn. Không đếm calo, không ăn kiêng."
    mo_ta_en: "Grace before meals in many traditions, one slow meal a day, screen-free meals and thanking the people who make our food. No calorie counting, no dieting."
    tang: "1"
    phut: "15"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 4 tuần"
    tien_do_en: "All 4 weeks published"
    duyet: chu-du-an
    co_goc_tre: true
    ra_mat: "Th11/2026"
    ra_mat_en: "Nov 2026"
    nghien_cuu: [cregg2021, robinson2013, robinson2014, hammons2011]
    bai_tep:
      - than-the/tt1-tuan-01
      - than-the/tt1-tuan-02
      - than-the/tt1-tuan-03
      - than-the/tt1-tuan-04
    bai:
      - "Lời cảm ơn trước bữa ăn | Grace before meals | Phục truyền 8:10 · Ma-thi-ơ 14:19 · Qur'an 2:172 || Deuteronomy 8:10 · Matthew 14:19 · Qur'an 2:172 | Dừng 1 phút trước 1 bữa/ngày ≥5/7 | Pause one minute before one meal a day on 5 of 7 days"
      - "Một bữa chậm | One slow meal | MN 10 · Đạo Đức Kinh 12 || MN 10 · Tao Te Ching 12 | Ăn chậm 1 bữa/ngày khoảng 15′, ≥5/7 | One slow meal of about 15′ a day on 5 of 7 days"
      - "Bữa không màn hình | A screen-free meal | Pirkei Avot III.4 · Công vụ 2:46–47 · Truyền đạo 9:7 || Pirkei Avot III.4 · Acts 2:46–47 · Ecclesiastes 9:7 | ≥3 bữa không màn hình/tuần, ghi ăn với ai | At least 3 screen-free meals a week, noting who you ate with"
      - "Cảm ơn người trồng và người nấu | Thanking growers and cooks | Qur'an 80:24–32 · Berakhot 58a | 1 lời cảm ơn cụ thể; tự chấm 4 thói quen, giữ ≥1 | One specific thank-you; rate the four habits, keep at least one"
    gioi_han: "Không đếm calo, không cân, không ăn kiêng và không nhằm giảm cân. Ai đang hoặc từng có rối loạn ăn uống nên bàn với bác sĩ trước. Các đoạn kinh được đọc để hiểu lời cảm tạ trong từng truyền thống; khóa không hướng dẫn nghi lễ hay luật ăn uống của truyền thống nào. Chưa có nghiên cứu nào đánh giá trực tiếp lời cảm ơn trước bữa ăn; các nghiên cứu về ăn chậm, ăn có chú ý là thí nghiệm ngắn trong phòng thí nghiệm, nghiên cứu về bữa ăn gia đình là tương quan. Tuần 4 dùng bản Talmud Steinsaltz nên trang ấy theo giấy phép CC BY-NC 4.0."
    gioi_han_en: "No calorie counting, weighing or dieting, and not aimed at weight loss. Anyone with a current or past eating disorder should talk to a doctor first. The passages are read to understand thanksgiving in each tradition; the course gives no ritual or dietary instruction for any tradition. No study has evaluated grace before meals directly; the studies on slow and attentive eating are short laboratory experiments, and the study on family meals is correlational. Week 4 uses the Steinsaltz Talmud, so that page is licensed CC BY-NC 4.0."

  - ma: TT2
    slug: than-the-2
    slug_en: body-2
    nhom: than-the
    ten: "Vận động chánh niệm"
    ten_en: "Mindful movement"
    mo_ta: "Đi thiền, giãn cơ chậm và một buổi vận động liền mạch 10–15 phút, cùng các lời dạy về thân thể trong nhiều truyền thống. Không nhằm giảm cân hay đạt thành tích."
    mo_ta_en: "Walking meditation, slow stretching and one continuous 10–15 minute movement session, with teachings on the body from several traditions. Not aimed at weight loss or performance."
    tang: "2"
    phut: "10–15"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 4 tuần"
    tien_do_en: "All 4 weeks published"
    duyet: chu-du-an
    co_goc_tre: true
    ra_mat: "Th11/2026"
    ra_mat_en: "Nov 2026"
    nghien_cuu: [phoobangkerdphol2022, farias2020, singh2023, hanson2015, paluch2022]
    bai_tep:
      - than-the/tt2-tuan-01
      - than-the/tt2-tuan-02
      - than-the/tt2-tuan-03
      - than-the/tt2-tuan-04
    bai:
      - "Đi thiền | Walking meditation | MN 10 · Đạo Đức Kinh 64 || MN 10 · Tao Te Ching 64 | Đi chậm 10 phút ≥5/7 | Walk slowly 10 minutes on 5 of 7 days"
      - "Giãn cơ chậm | Slow stretching | MN 10 · 1 Cô-rinh-tô 6:19–20 || MN 10 · 1 Corinthians 6:19–20 | Giãn cơ 10 phút ≥5/7 | Stretch 10 minutes on 5 of 7 days"
      - "Chảy như nước | Flowing like water | Đạo Đức Kinh 78 · Ê-sai 40:29–31 · Seneca Thư 15 || Tao Te Ching 78 · Isaiah 40:29–31 · Seneca Letter 15 | Buổi liền mạch 15 phút ≥5/7 | One continuous 15-minute session on 5 of 7 days"
      - "Ôn tập và nhịp của riêng mình | Review and a rhythm of your own | Encheiridion XLI · 1 Ti-mô-thê 4:8 · Bukhari 1975 || Encheiridion XLI · 1 Timothy 4:8 · Bukhari 1975 | ≥4 buổi; viết nhịp cho tháng sau | At least 4 sessions; write a rhythm for next month"
    gioi_han: "Vận động nhẹ, không nhằm giảm cân hay đạt thành tích, không đếm bước, không thay chương trình tập của bác sĩ hay chuyên viên vật lý trị liệu. Người có bệnh tim mạch, huyết áp chưa kiểm soát, bệnh xương khớp, vừa mổ, đang mang thai hay dễ té ngã nên hỏi bác sĩ trước. Các đoạn kinh được đọc để hiểu cách mỗi truyền thống nhìn thân thể; không đoạn nào là lời khuyên tập thể dục. Chưa có phân tích gộp riêng về đi thiền hay giãn cơ chậm với sức khỏe tinh thần; bằng chứng chủ yếu về vận động nói chung, nghiên cứu về số bước là tương quan. Giấc ngủ có trang gốc trên daynentang.com; ở đây chỉ đặt link."
    gioi_han_en: "Gentle movement, not aimed at weight loss or performance, no step counting, and not a replacement for an exercise programme from a doctor or physiotherapist. People with heart disease, uncontrolled blood pressure, joint or bone problems, recent surgery, pregnancy or a tendency to fall should ask a doctor first. The passages are read to understand how each tradition sees the body; none is exercise advice. There is no meta-analysis of walking meditation or slow stretching and mental health; the evidence is mostly about physical activity in general, and the study on steps is correlational. Sleep has its home on daynentang.com; we only link there."

  - ma: TT3
    slug: than-the-3
    slug_en: body-3
    nhom: than-the
    ten: "Kỷ luật ăn tùy chọn: ăn thực vật và 16:8"
    ten_en: "Optional eating disciplines: plant-based eating and 16:8"
    mo_ta: "Chỉ cho người lớn khỏe mạnh. Tuần đầu là danh sách người không nên làm và bảng tự kiểm tra; sau đó thử ăn thực vật ở mức vừa sức, thu hẹp dần khung giờ ăn tới 16:8 nếu thấy ổn, rồi lắng nghe cơ thể để giữ, giảm hay dừng. Không đếm calo, không nhằm giảm cân. Chưa có chuyên gia dinh dưỡng duyệt."
    mo_ta_en: "For healthy adults only. The first week is a list of people who should not do this and a self-check; then you try plant-based eating at a manageable level, narrow your eating window step by step to 16:8 if it feels fine, and listen to your body to keep, reduce or stop. No calorie counting, not aimed at weight loss. Not yet reviewed by a dietitian."
    tang: "4"
    phut: "10 + bữa ăn"
    phut_en: "10 + meals"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 4 tuần"
    tien_do_en: "All 4 weeks published"
    duyet: chu-du-an
    co_goc_tre: true
    ra_mat: "Th11/2026"
    ra_mat_en: "Nov 2026"
    nghien_cuu: [semnani2025, koch2023, iguacel2021, lowe2020, liu2022]
    bai_tep:
      - than-the/tt3-tuan-01
      - than-the/tt3-tuan-02
      - than-the/tt3-tuan-03
      - than-the/tt3-tuan-04
    bai:
      - "Ai không nên làm | Who should not do this | Bhagavad Gita 6:16–17 · Pháp Cú 204 || Bhagavad Gita 6:16–17 · Dhammapada 204 | Làm bảng tự kiểm tra; ghi giờ ăn 3 ngày | Complete the self-check; note meal times for 3 days"
      - "Ăn thực vật như một kỷ luật | Plant-based eating as a discipline | Sáng thế 1:29 · Đa-ni-ên 1:12–15 · Seneca Thư 108 || Genesis 1:29 · Daniel 1:12–15 · Seneca Letter 108 | Giữ mức đã chọn ≥5/7 | Keep your chosen level on 5 of 7 days"
      - "Khung giờ ăn 16:8 | The 16:8 eating window | Encheiridion XLVII · Truyền đạo 3:1 || Encheiridion XLVII · Ecclesiastes 3:1 | Giữ khung 12, 10 hay 8 giờ ≥4/7 | Keep a 12, 10 or 8-hour window on 4 of 7 days"
      - "Lắng nghe cơ thể và dừng lại | Listening to the body and stopping | Đạo Đức Kinh 44 · Bukhari 1975 || Tao Te Ching 44 · Bukhari 1975 | Nghe cơ thể 2 phút ≥5/7; viết quyết định giữ, giảm hay dừng | Listen to the body 2 minutes on 5 of 7 days; write a decision to keep, reduce or stop"
    gioi_han: "Không nên làm: phụ nữ mang thai, cho con bú; trẻ em và thanh thiếu niên; người đái tháo đường đang dùng thuốc (nhất là insulin, sulfonylurea); người đang có hoặc từng có rối loạn ăn uống. Người thiếu cân, dùng thuốc phải uống theo bữa, người lớn tuổi yếu hay đang điều trị bệnh mạn tính: hỏi bác sĩ trước. Khóa chưa có chuyên gia dinh dưỡng hay bác sĩ duyệt; các bước thực hành là đánh giá của người viết. Các đoạn kinh được đọc để hiểu cách mỗi truyền thống nhìn chuyện ăn uống; không đoạn nào là lời khuyên ăn kiêng, và khóa không thay thế nhịn chay trong tôn giáo. Bằng chứng: 16:8 không giảm cân hơn ăn bớt mỗi ngày; ăn chay giảm mỡ máu trong thử nghiệm; chưa có bằng chứng tốt rằng hai kỷ luật này giúp đời sống tinh thần. Nhịn ăn gián đoạn không phải phép màu."
    gioi_han_en: "Not for: pregnant or breastfeeding women; children and teenagers; people with diabetes on medication (especially insulin or a sulfonylurea); anyone with a current or past eating disorder. People who are underweight, take medication that must be taken with food, are older and frail, or are being treated for a chronic illness should ask a doctor first. The course has not been reviewed by a dietitian or doctor; the practice steps are the writer's judgement. The passages are read to understand how each tradition sees eating; none is dietary advice, and the course does not replace religious fasting. Evidence: 16:8 gives no more weight loss than daily calorie restriction; vegetarian diets lower blood fats in trials; there is no good evidence that either discipline helps inner life. Intermittent fasting is not magic."

