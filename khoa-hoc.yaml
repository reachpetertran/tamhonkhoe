    gioi_han: "Thở 1–3 phút có trang gốc trên daynentang.com. Thiền cũng có thể gây trải nghiệm khó chịu; mỗi bài có mục \"Dừng tập khi\". Khóa trình bày phần thực hành, không đòi người học chấp nhận niềm tin về tái sinh hay các cõi; bài tập không có phần đổi chế độ ăn hay hành hạ thân. Chưa có người duyệt từ trong truyền thống Phật giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này."
    gioi_han_en: "1–3 minute breathing has its home on daynentang.com. Meditation can also bring difficult experiences; every lesson has a ‘Stop practising if’ section. The course presents the practice and does not ask learners to accept beliefs about rebirth or other realms; no exercise involves changing your diet or harming the body. No reviewer from within the Buddhist tradition has checked it yet, and no study has evaluated this programme directly."

