    gioi_han: "Bài \"tập thiếu thốn\" chỉ là việc nhỏ như không mua sắm một ngày hay đi bộ thay đi xe; không bớt ăn, không nhịn ăn, không bớt ngủ. Chưa có nghiên cứu đánh giá trực tiếp chương trình này."
