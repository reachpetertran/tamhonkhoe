    mo_ta: "Đạo Đức Kinh chương 2, 11, 22, 48, 37, 63, 43 và hai chuyện trong Trang Tử chương IV (\"tâm trai\", cây lịch); mỗi ngày ngồi 20–30 phút và một việc nhỏ: bớt, nghe, không ép. \"Tâm trai\" là nhịn của tâm, không phải nhịn ăn."
    mo_ta_en: "Tao Te Ching chapters 2, 11, 22, 48, 37, 63 and 43, and two stories from Zhuangzi chapter IV (‘fasting of the mind’, the li tree); each day 20–30 minutes of sitting and one small action: doing less, listening, not forcing. ‘Fasting of the mind’ is of the mind, not of the body."
