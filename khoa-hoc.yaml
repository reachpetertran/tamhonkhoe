    bai_tep: [khe/kito-giao/kt4-tuan-01, khe/kito-giao/kt4-tuan-02, khe/kito-giao/kt4-tuan-03, khe/kito-giao/kt4-tuan-04, khe/kito-giao/kt4-tuan-05, khe/kito-giao/kt4-tuan-06]
    bai:
      - "Những người bé nhỏ nhất | The least of these | Mt 25:34–40 || Matthew 25:34–40 | Đọc ≥5/7; 2 việc cho người đang thiếu trong tuần | Read on 5 of 7 mornings; 2 acts for someone in need during the week"
      - "Đức tin và việc làm | Faith and works | Gc 2:14–17 || James 2:14–17 | Mỗi sáng 1 kế hoạch \"nếu… thì…\"; làm đúng ≥5/7 | One \"if… then…\" plan each morning; carried out on 5 of 7 days"
      - "Chia sẻ trong cộng đoàn | Sharing in community | Cv 2:44–47 || Acts 2:44–47 | Đọc ≥5/7; góp 1 lần vào bữa ăn hay việc chung của một nhóm | Read on 5 of 7 mornings; contribute once to a shared meal or task of a group"
      - "Làm việc hết lòng | Working wholeheartedly | Cl 3:17, 23 || Colossians 3:17, 23 | Làm trọn 1 việc ≥5/7; dừng đúng giờ ≥5/7 | Do one task fully on 5 of 7 days; stop on time on 5 of 7 days"
      - "Gia đình | Family | Cl 3:12–14 · 1 Ga 3:18 || Colossians 3:12–14 · 1 John 3:18 | 1 việc thương cho từng người trong nhà; ≥3 bữa ăn chung không điện thoại | One act of love for each person at home; 3 or more shared meals without phones"
      - "Ôn tập | Review | Mi 6:8 · Mt 6:3–4 || Micah 6:8 · Matthew 6:3–4 | 1 việc tốt kín đáo; tự chấm 6 thói quen, giữ 2, kế hoạch 4 tuần | One hidden good act; rate six habits, keep two, write a 4-week plan"
    gioi_han: "Khóa Tầng 4: không thêm giờ ngồi, chỉ khoảng 10 phút đọc và nhìn lại mỗi ngày, phần còn lại nằm trong việc bạn vẫn làm. Khóa mô tả và tập điều truyền thống Kitô giáo dạy về việc làm của đức tin; người học không cần theo đạo, và bước nhìn lại buổi tối có cách cho người không cầu nguyện (viết một dòng), là điều chỉnh của tamhonkhoe. Khóa chỉ đọc vài đoạn ngắn: không giải thích giáo lý về phán xét, không bàn tranh luận Tin Lành – Công giáo về đức tin và việc làm, không dùng Công vụ 2 để bàn về kinh tế hay chính trị, không trích các lời dặn riêng cho vợ, chồng, con cái và tôi tớ trong Cô-lô-se 3:18–22. Việc giúp người luôn trong giới hạn an toàn và khả năng của mình; khóa không khuyên ai bán tài sản hay góp tiền cho một nhóm, và không phải lời khuyên tài chính. \"Làm việc hết lòng\" không có nghĩa là làm quá giờ hay chấp nhận điều kiện làm việc không an toàn. \"Nhường nhịn\" và \"tha thứ\" không dùng cho bạo lực, xâm hại hay kiểm soát trong nhà. Bản Việt dùng nguyên văn bản Kinh Thánh 1925 (Tin Lành); người Công giáo quen một bản dịch khác. Chưa có người duyệt từ trong truyền thống Kitô giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; bằng chứng trong bài chỉ là gián tiếp."
    gioi_han_en: "A Level 4 course: no extra sitting time, only about 10 minutes of reading and looking back each day; the rest lies within what you already do. The course describes and practises what the Christian tradition teaches about the works of faith; learners do not need to be Christian, and the evening look-back offers an option for those who do not pray (writing one line), which is tamhonkhoe’s adaptation. The course reads only a few short passages: it does not explain the doctrine of judgement, does not go into the Protestant–Catholic debate on faith and works, does not use Acts 2 to discuss economics or politics, and does not quote the instructions to wives, husbands, children and servants in Colossians 3:18–22. Helping others always stays within safe limits and your own means; the course does not advise anyone to sell property or give money to a group, and is not financial advice. ‘Working heartily’ does not mean working long hours or accepting unsafe working conditions. ‘Bearing with’ and ‘forgiving’ are not for violence, abuse or control at home. The English pages quote the World English Bible. No reviewer from within the Christian tradition has checked it yet, and no study has evaluated this programme directly; the evidence in the lessons is only indirect."

  # ------------------------------------------------------------ HỒI GIÁO
  - ma: HG1
    slug: hoi-giao-1
    slug_en: islam-1
    nhom: hoi-giao
    ten: "Nhập môn: biết ơn, nhẫn nại, việc nhỏ đều đặn"
    ten_en: "Introduction: gratitude, patience, small regular deeds"
    mo_ta: "Al-Fatihah, năm trụ cột (mô tả theo hadith Jibril) và Qur'an 2:177, rồi biết ơn (14:7, 14:34), nhẫn nại và không quá sức (103, 2:286), để nhận biết lẫn nhau (49:13), việc nhỏ đều đặn (99:7–8, Bukhari 6464). Mỗi ngày đọc chậm 10 phút và làm một việc nhỏ. Khóa mô tả, không hướng dẫn nghi lễ."
    mo_ta_en: "Al-Fatihah, the five pillars (as described in the hadith of Jibril) and Qur'an 2:177, then gratitude (14:7, 14:34), patience and not beyond capacity (103, 2:286), knowing one another (49:13), and small regular deeds (99:7–8, Bukhari 6464). Ten minutes of slow reading and one small deed a day. The course describes; it does not teach ritual."
    tang: "1"
    phut: "10–15"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 6 tuần"
