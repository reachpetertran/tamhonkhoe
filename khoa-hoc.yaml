      - "Láng giềng và người lỡ đường | Neighbours and the wayfarer | Qur'an 4:36 · Bukhari 6014 | Biết tên 1 hàng xóm; 1 việc giúp hàng xóm; 1 việc tử tế với người xa nhà | Learn one neighbour's name; one help for a neighbour; one kindness to someone far from home"
      - "Ôn tập | Review | Qur'an 76:8–9 | Tự chấm 7 thói quen, giữ 2, kế hoạch 4 tuần | Rate seven habits, keep two, write a 4-week plan"
    gioi_han: "Khóa Tầng 4, khoảng 15 phút mỗi ngày cộng vài việc trong tuần. Khóa mô tả zakat, sadaqah và tháng Ramadan như người Hồi giáo hiểu và thực hành; người học không cần theo đạo. Khóa không hướng dẫn nghi lễ: không dạy cách tính zakat, không hướng dẫn nhịn chay Ramadan, và không đề nghị ai đổi niềm tin. Khóa không phải lời khuyên tài chính; bài tập cho đi là trong sức mình, không vay mượn, không bớt chi tiêu thiết yếu. Bài tiết chế nhẹ ở Tuần 2 là tùy chọn, chỉ cho người lớn khỏe mạnh: bỏ một món ăn vặt hay đồ uống ngọt trong 3 ngày, không bỏ bữa, không nhịn uống, không nhằm giảm cân; không dành cho người dưới 18 tuổi, người mang thai hay cho con bú, người đang có hay từng có rối loạn ăn uống, người đái tháo đường dùng thuốc hay có bệnh mạn tính đang điều trị. Góc trẻ không có nhịn ăn hay bỏ món. Các bài tập không phải zakat hay nhịn chay và không thay thế chúng. Trang tiếng Việt dẫn nguyên văn bản dịch nghĩa của Hasan Abdulkarim trên QuranEnc.com, không sửa; trang tiếng Anh dùng bản Pickthall. Hadith chỉ được tóm ý vì bản dịch trên sunnah.com còn bản quyền. Khóa ghi nhận một số khác biệt giữa người Sunni và Shi'a (khums, các đêm cuối Ramadan) mà không so sánh. Phần mô tả tập quán là đánh giá của người viết; chưa có người duyệt từ trong truyền thống Hồi giáo, chưa có chuyên gia dinh dưỡng xem bài tiết chế, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; bằng chứng trong bài chỉ là gián tiếp."
    gioi_han_en: "A Level 4 course, about 15 minutes a day plus a few actions in the week. It describes zakat, sadaqah and the month of Ramadan as Muslims understand and practise them; learners do not need to be Muslim. It does not teach ritual: it does not teach how to calculate zakat, does not teach the Ramadan fast, and does not ask anyone to change their beliefs. It is not financial advice; the giving exercises are within your means, without borrowing or cutting essential spending. The light restraint exercise in Week 2 is optional and for healthy adults only: leaving out one snack or sweet drink on 3 days, with no skipped meals, no going without drinks and no weight-loss aim; it is not for anyone under 18, pregnant or breastfeeding, with a current or past eating disorder, with diabetes treated with medication or a chronic illness under treatment. The kids' corner has no fasting or giving up foods. The exercises are not zakat or fasting and do not replace them. The Vietnamese pages quote Hasan Abdulkarim's translation on QuranEnc.com word for word; the English pages quote Pickthall. Hadith are only summarised, because the translations on sunnah.com are in copyright. The course notes some differences between Sunni and Shi'a practice (khums, the last nights of Ramadan) without comparing them. The descriptions of practice are the writer's judgement; no reviewer from within the Islamic tradition has checked it yet, no nutrition expert has reviewed the restraint exercise, and no study has evaluated this programme directly; the evidence in the lessons is only indirect."

