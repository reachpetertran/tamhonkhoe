      - "Dhikr trong hadith | Dhikr in the hadith | Qur'an 2:186 · Bukhari 6407 · Bukhari 7405 | Ngồi im 15 phút ≥5/7; kể lại ý chính 2 hadith | Sit still 15 minutes on 5 of 7 days; retell the main point of two hadith"
      - "Nhịp ngày của người tìm hiểu | A learner’s daily rhythm | Qur'an 3:190–191 | 3 kế hoạch \"nếu… thì…\"; 1 phút nhìn trời ≥5/7 | Three \"if… then…\" plans; one minute looking at the sky on 5 of 7 days"
      - "Thứ Sáu và cộng đồng | Friday and community | Qur'an 62:9–10 | 1 khối 60 phút cho người khác; 1 khối 30 phút tạm gác việc mua bán | One 60-minute block for others; one 30-minute block away from buying and selling"
      - "Kiên trì | Perseverance | Qur'an 2:153 · 94:5–6 | Viết phiên bản tối thiểu; không bỏ 2 ngày liền; ngồi 20 phút ≥3 ngày | Write a minimum version; never miss two days in a row; sit 20 minutes on 3 or more days"
      - "Ôn tập | Review | Qur'an 7:205 | Tự chấm 8 thói quen, giữ 2, kế hoạch 4 tuần | Rate eight habits, keep two, write a 4-week plan"
    gioi_han: "Khóa Tầng 2, 20–30 phút mỗi ngày. Khóa mô tả dhikr và năm lần cầu nguyện (Salah) như người Hồi giáo hiểu và thực hành; người học không cần theo đạo. Khóa không hướng dẫn nghi lễ: không dạy cách cầu nguyện, tẩy rửa, tụng niệm hay đọc tiếng Ả Rập, và không đề nghị ai đổi niềm tin. Bài tập của khóa là nhịp trung tính do tamhonkhoe đặt ra (ba lần dừng lại theo nếp ngày của mình, ngồi im, ghi chép): nhịp này không theo giờ cầu nguyện, không có cúi lạy, không đọc lời kinh tiếng Ả Rập, không phải dhikr hay Salah và không thay thế chúng. Người Hồi giáo giữ dhikr và Salah theo cách cộng đồng và người hướng dẫn của mình dạy. Trang tiếng Việt dẫn nguyên văn bản dịch nghĩa của Hasan Abdulkarim trên QuranEnc.com, không sửa, kể cả chú thích; trang tiếng Anh dùng bản Pickthall. Hadith chỉ được tóm ý vì bản dịch trên sunnah.com còn bản quyền. Khóa ghi nhận một số khác biệt giữa người Sunni và Shi'a mà không so sánh, và không đi vào các cách chú giải gây tranh luận hay giáo lý về đời sau. Ngồi im lâu có thể gây khó chịu; mỗi bài có mục Dừng tập khi. Chưa có người duyệt từ trong truyền thống Hồi giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; bằng chứng trong bài chỉ là gián tiếp."
    gioi_han_en: "A Level 2 course, 20–30 minutes a day. It describes dhikr and the five daily prayers (Salah) as Muslims understand and practise them; learners do not need to be Muslim. It does not teach ritual: it does not teach how to pray, perform ablution, recite or read Arabic, and does not ask anyone to change their beliefs. The course's exercises are neutral rhythms set by tamhonkhoe (three pauses tied to your own day, sitting still, writing): they do not follow prayer times, involve no bowing, recite no Arabic words of scripture, are not dhikr or Salah and do not replace them. Muslims keep dhikr and Salah as their own community and teachers teach them. The Vietnamese pages quote Hasan Abdulkarim’s translation on QuranEnc.com word for word, footnotes included; the English pages quote Pickthall. Hadith are only summarised, because the translations on sunnah.com are in copyright. The course notes some differences between Sunni and Shi'a practice without comparing them, and does not go into disputed interpretations or teaching about the afterlife. Long sitting can be uncomfortable; every lesson has a Stop practising section. No reviewer from within the Islamic tradition has checked it yet, and no study has evaluated this programme directly; the evidence in the lessons is only indirect."

  - ma: HG3
    slug: hoi-giao-3
    slug_en: islam-3
    nhom: hoi-giao
    ten: "Rumi và truyền thống Sufi"
    ten_en: "Rumi and the Sufi tradition"
    mo_ta: "Đọc chậm sách Masnavi của Rumi qua bản Whinfield (1898): cây sáo sậy, chiếc bình của lòng tham, tình yêu, người gõ cửa và tấm gương, con voi trong phòng tối; kèm Qur'an 2:156, 3:31, 50:16. Mô tả Rumi, Shams, dòng Mevlevi và nghi lễ sema; không hướng dẫn nghi lễ Sufi. Bài tập là nhịp trung tính do tamhonkhoe đặt ra: đọc chậm, ngồi im lắng nghe 20–25 phút, một ngày không mua thêm, việc chăm sóc và việc tốt không ai biết, trò chuyện với người đồng hành."
    mo_ta_en: "Slow reading of Rumi's Masnavi in Whinfield's version (1898): the reed flute, the pitcher of greed, love, the man at the door and the mirror, the elephant in a dark room; with Qur'an 2:156, 3:31 and 50:16. Describes Rumi, Shams, the Mevlevi order and the sema ceremony; no Sufi ritual is taught. The exercises are neutral rhythms set by tamhonkhoe: slow reading, 20–25 minutes of sitting and listening, a day buying nothing extra, acts of care and unseen good deeds, talking with a companion."
    tang: "3"
    phut: "30–45"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 6 tuần"
    tien_do_en: "All 6 weeks published"
