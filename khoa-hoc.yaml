      - "Việc nhỏ đều đặn (và ôn tập) | Small regular deeds (and review) | Qur'an 99:7–8 · Bukhari 6464 | Giữ 1 việc nhỏ ≥6/7; tự chấm 6 thói quen, giữ 2, kế hoạch 4 tuần | Keep one small deed on 6 of 7 days; rate six habits, keep two, write a 4-week plan"
    gioi_han: "Khóa mô tả và tập điều truyền thống Hồi giáo dạy về biết ơn, nhẫn nại và việc tốt nhỏ mà đều đặn; người học không cần theo đạo. Khóa không hướng dẫn nghi lễ (Salah, nhịn chay, Zakah, Hajj chỉ được mô tả), không dạy đọc tiếng Ả Rập, không có bài tập dừng lại theo giờ cầu nguyện, và không đề nghị ai đổi niềm tin. Bài đọc của người không theo đạo là để hiểu, không phải cầu nguyện. Trang tiếng Việt dẫn nguyên văn bản dịch nghĩa của Hasan Abdulkarim trên QuranEnc.com, không sửa, kể cả chú thích; trang tiếng Anh dùng bản Pickthall. Hadith chỉ được tóm ý (tiếng Việt) hoặc trích một cụm ngắn (tiếng Anh) vì bản dịch trên sunnah.com còn bản quyền. Khóa chỉ đọc vài đoạn ngắn và không đi vào các cách chú giải gây tranh luận. \"Nhẫn nại\" không có nghĩa là chịu đựng bạo lực, xâm hại hay bóc lột. Chưa có người duyệt từ trong truyền thống Hồi giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; bằng chứng trong bài chỉ là gián tiếp."
    gioi_han_en: "The course describes and practises what the Islamic tradition teaches about gratitude, patience and small good deeds done regularly; learners do not need to be Muslim. It does not teach ritual (Salah, fasting, Zakah and Hajj are only described), does not teach Arabic recitation, has no exercise of pausing at prayer times, and does not ask anyone to change their beliefs. For those who are not Muslim, the reading is for understanding, not prayer. The Vietnamese pages quote Hasan Abdulkarim’s translation on QuranEnc.com word for word, footnotes included; the English pages quote Pickthall. Hadith are only summarised (Vietnamese) or quoted in a short phrase (English), because the translations on sunnah.com are in copyright. The course reads only a few short passages and does not go into disputed interpretations. ‘Patience’ does not mean putting up with violence, abuse or exploitation. No reviewer from within the Islamic tradition has checked it yet, and no study has evaluated this programme directly; the evidence in the lessons is only indirect."

  - ma: HG2
    slug: hoi-giao-2
    slug_en: islam-2
    nhom: hoi-giao
    ten: "Dhikr và nhịp ngày (mô tả)"
    ten_en: "Dhikr and the rhythm of the day (described)"
    mo_ta: "Dhikr (tưởng nhớ Allah) và năm lần cầu nguyện được mô tả qua Qur'an 13:28, 2:152, 33:41–42, 11:114, 29:45, 2:186, 3:190–191, 62:9–10, 2:153, 94:5–6, 7:205 và ba hadith (tóm ý). Không hướng dẫn nghi lễ. Bài tập là nhịp trung tính do tamhonkhoe đặt ra: đọc chậm buổi sáng, ngồi im 10–20 phút, ba lần dừng lại theo nếp ngày của mình (không theo giờ cầu nguyện), ghi một dòng buổi tối."
    mo_ta_en: "Dhikr (remembrance of Allah) and the five daily prayers described through Qur'an 13:28, 2:152, 33:41–42, 11:114, 29:45, 2:186, 3:190–191, 62:9–10, 2:153, 94:5–6, 7:205 and three hadith (summarised). No ritual instruction. The exercises are neutral rhythms set by tamhonkhoe: slow reading in the morning, 10–20 minutes of sitting still, three pauses tied to your own day (not to prayer times), one line written in the evening."
