    mo_ta: "Thi thiên 23, các mối phúc, Kinh Lạy Cha, dụ ngôn người Sa-ma-ri, \"chim trời, hoa huệ\" và 1 Cô-rinh-tô 13, đọc chậm theo bốn bước của lectio divina: đọc, suy niệm, đáp lời, lặng yên; từ tuần 4 thêm một việc làm nhỏ."
    mo_ta_en: "Psalm 23, the Beatitudes, the Lord’s Prayer, the parable of the Samaritan, \"the birds and the lilies\" and 1 Corinthians 13, read slowly in the four steps of lectio divina: reading, meditation, response, stillness; from week 4, one small action is added."
