    bai_tep: [khe/phat-giao/pg4-tuan-01, khe/phat-giao/pg4-tuan-02, khe/phat-giao/pg4-tuan-03, khe/phat-giao/pg4-tuan-04, khe/phat-giao/pg4-tuan-05, khe/phat-giao/pg4-tuan-06]
    bai:
      - "Bổn phận trong các mối quan hệ | Duties in relationships | DN 31 | 1 việc nhỏ cho 1 \"phương\"/ngày ≥5/7; chạm ≥4/6 phương | One small thing for one ‘direction’ a day on 5 of 7 days; reach at least 4 of 6 directions"
      - "Đời sống tại gia an lạc | A good lay life | AN 8.54 · DN 31 | Làm xong 1 việc đã chọn ≥5/7; 1 cuộc trò chuyện với bạn tốt | Finish one chosen task on 5 of 7 days; one conversation with a good friend"
      - "Soi lại việc mình làm | Reflecting on our actions | MN 61 | Soi 3 lần 1 việc/ngày ≥5/7; ghi ≥2 việc tốt | Check one action three times a day on 5 of 7 days; note at least 2 good deeds"
      - "Vợ chồng đồng hành | Partners together | AN 4.55 | 1 lời cảm ơn cụ thể ≥5/7; 1 buổi nói chuyện 20′ | One specific thank-you on 5 of 7 days; one 20′ conversation"
      - "Tiền bạc và cho đi | Money and giving | AN 8.54 · DN 31 | Ghi thu chi ≥6/7; cho đi 1 lần | Track money on 6 of 7 days; give once"
      - "Ôn tập | Review | DN 31 · MN 61 · AN 8.54 | Tự chấm 5 thói quen, giữ 2 ≥5/7; kế hoạch 4 tuần | Rate five habits, keep two on 5 of 7 days; a 4-week plan"
    gioi_han: "Khóa Tầng 4: không có buổi ngồi dài, chỉ đọc khoảng 10 phút mỗi ngày và tập trong việc nhà, việc làm, các mối quan hệ. Các bài kinh phản ánh xã hội Ấn Độ cổ (gia nhân, hôn nhân do cha mẹ sắp đặt, chia việc theo giới); khóa giữ ý bổn phận đi hai chiều, không giữ các cách phân vai ấy. Khóa không dùng lời kinh để khuyên ai ở lại trong một mối quan hệ có bạo lực hay kiểm soát. Phần tiền bạc chỉ mô tả lời dạy, không phải lời khuyên tài chính; khóa không xin tiền và không gợi ý cho tổ chức nào. Người học không cần tin vào tái sinh. Chưa có người duyệt từ trong truyền thống Phật giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; tuần 2 và 4 không có bằng chứng khoa học."
    gioi_han_en: "A Level 4 course: no long sitting, only about 10 minutes of reading a day and practice in housework, work and relationships. The discourses reflect ancient Indian society (bondservants, marriages arranged by parents, roles divided by gender); the course keeps the idea that duties go both ways, not those divisions of roles. The course does not use the discourses to advise anyone to stay in a relationship with violence or control. The money lessons only describe the teaching and are not financial advice; the course asks for no money and recommends no organisation. Learners do not need to believe in rebirth. No reviewer from within the Buddhist tradition has checked it yet, and no study has evaluated this programme directly; weeks 2 and 4 have no scientific evidence."

  # ------------------------------------------------------------ KITÔ GIÁO
  - ma: KT1
    slug: kito-giao-1
    slug_en: christianity-1
    nhom: kito-giao
    ten: "Đọc chậm Lời Chúa (lectio divina)"
    ten_en: "Slow reading of Scripture (lectio divina)"
    mo_ta: "Thi thiên 23, các mối phúc, Kinh Lạy Cha, dụ ngôn người Sa-ma-ri, \"chim trời, hoa huệ\" và 1 Cô-rinh-tô 13, đọc chậm theo bốn bước của lectio divina: đọc, suy niệm, đáp lời, lặng yên; từ tuần 4 thêm một việc làm nhỏ."
    mo_ta_en: "Psalm 23, the Beatitudes, the Lord’s Prayer, the parable of the Samaritan, \"the birds and the lilies\" and 1 Corinthians 13, read slowly in the four steps of lectio divina: reading, meditation, response, stillness; from week 4, one small action is added."
    tang: "1"
    phut: "10–15"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 6 tuần"
    tien_do_en: "All 6 weeks published"
    duyet: chu-du-an
    ra_mat: "Th11/2026"
    ra_mat_en: "Nov 2026"
    co_goc_tre: true
    nghien_cuu: [captari2018, goncalves2015, wade2014, curry2018, gloster2020, friese2017]
    bai_tep: [khe/kito-giao/kt1-tuan-01, khe/kito-giao/kt1-tuan-02, khe/kito-giao/kt1-tuan-03, khe/kito-giao/kt1-tuan-04, khe/kito-giao/kt1-tuan-05, khe/kito-giao/kt1-tuan-06]
    bai:
      - "Người chăn | The shepherd | Thi thiên 23 || Psalm 23 | Đọc chậm 10 phút theo bốn bước ≥5/7 | Slow reading for 10 minutes in four steps on 5 of 7 days"
      - "Các mối phúc | The Beatitudes | Mt 5:3–9 || Matthew 5:3–9 | Đọc ≥5/7; ghi 1 dòng sau mỗi lần đọc | Read on 5 of 7 days; write one line after each reading"
      - "Kinh Lạy Cha (mô tả) | The Lord’s Prayer (described) | Mt 6:9–13 || Matthew 6:9–13 | Đọc và ghi 1 dòng ≥5/7; đọc thành lời cầu là tùy chọn | Read and note one line on 5 of 7 days; praying it is optional"
      - "Người Samari nhân hậu | The Good Samaritan | Lc 10:25–37 || Luke 10:25–37 | Đọc ≥5/7; 1 việc giúp người lạ trong tuần, trong giới hạn an toàn | Read on 5 of 7 days; one act of help to a stranger in the week, within safe limits"
      - "Đừng lo lắng | Do not worry | Mt 6:25–34 || Matthew 6:25–34 | Đọc ≥5/7; 1 lần viết 3 nỗi lo, tách \"hôm nay\"/\"ngày mai\", đọc lại câu 34 | Read on 5 of 7 days; once, write three worries, sort \"today\"/\"tomorrow\", reread verse 34"
      - "Tình yêu là gì (và ôn tập) | What love is (and review) | 1 Cr 13:4–7 || 1 Corinthians 13:4–7 | Tập 1 đức tính ≥5/7; tự chấm 6 thói quen, giữ 2, kế hoạch 4 tuần | Practise one quality on 5 of 7 days; rate six habits, keep two, write a 4-week plan"
    gioi_han: "Khóa Tầng 1: mỗi ngày khoảng 12–15 phút. Khóa mô tả và tập cách đọc chậm của truyền thống Kitô giáo; người học không cần theo đạo, và bước \"đáp lời\" có cách cho người không cầu nguyện (viết một câu đáp lại), là điều chỉnh của tamhonkhoe chứ không phải hình thức của truyền thống. Bản Việt dùng nguyên văn bản Kinh Thánh 1925 (Tin Lành), chỉ sửa vài chữ bị lỗi mã hóa trong tệp điện tử và có ghi rõ; người Công giáo quen một bản dịch khác. Bài 3 không mời ai cầu nguyện theo một niềm tin mình không có. Câu \"tha\" và \"nín chịu mọi sự\" không dùng cho tổn thương do bạo lực, xâm hại hay kiểm soát. Bài 5 không thay cho điều trị lo âu, và không phải lời khuyên tài chính hay y tế. Chưa có người duyệt từ trong truyền thống Kitô giáo, và chưa có nghiên cứu tổng hợp riêng về lectio divina; bằng chứng trong bài chỉ là gián tiếp."
    gioi_han_en: "A Level 1 course: about 12–15 minutes a day. The course describes and practises the Christian tradition’s way of slow reading; learners do not need to be Christian, and the ‘response’ step offers an option for those who do not pray (writing one sentence in response), which is tamhonkhoe’s adaptation rather than a form of the tradition. The English pages quote the World English Bible. Lesson 3 does not invite anyone to pray in a faith they do not hold. The lines on forgiving and ‘enduring all things’ are not for harm from violence, abuse or control. Lesson 5 is not a treatment for anxiety, nor financial or medical advice. No reviewer from within the Christian tradition has checked it yet, and there is no review of lectio divina itself; the evidence in the lessons is only indirect."

