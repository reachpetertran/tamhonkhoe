    nghien_cuu: [wendsche2017, holtlunstad2010, pega2021, dunn2008, curry2018, gollwitzer2006, hammons2011, lally2010]
    bai_tep: [khe/do-thai-giao/dt4-tuan-01, khe/do-thai-giao/dt4-tuan-02, khe/do-thai-giao/dt4-tuan-03, khe/do-thai-giao/dt4-tuan-04, khe/do-thai-giao/dt4-tuan-05, khe/do-thai-giao/dt4-tuan-06]
    bai:
      - "Ngày thứ bảy, một niềm vui | The seventh day, a delight | Xuất hành 31:16–17 · Ê-sai 58:13–14 || Exodus 31:16–17 · Isaiah 58:13–14 | Đọc chậm ≥5/7; 1 buổi nghỉ chung ≥2 giờ có chuẩn bị từ hôm trước | Slow reading on 5 of 7 days; one shared rest of at least 2 hours, prepared the day before"
      - "Nghỉ cho cả người làm | Rest for workers too | Xuất hành 23:12 || Exodus 23:12 | Bảng việc nhà; người nghỉ ít nhất có thêm ≥1 giờ nghỉ; không nhắn việc ngoài giờ cả tuần | A household task list; the person who rests least gets at least 1 extra hour; no out-of-hours work messages all week"
      - "Mở tay cho người nghèo | Open your hand to the poor | Phục truyền 15:7–11 · Maimonides (tóm ý) || Deuteronomy 15:7–11 · Maimonides (summarised) | Hộp chia sẻ, mỗi người góp ≥1 lần; chọn nơi gửi | A sharing box, everyone contributes at least once; choose where to give"
      - "Chừa góc ruộng | Leaving the corner of the field | Lê-vi 19:9–10 · Phục truyền 24:19 || Leviticus 19:9–10 · Deuteronomy 24:19 | Chừa phần cho người khác ≥3 lần; 1 lần cho kín đáo | Set something aside for others at least 3 times; give quietly once"
      - "Bữa ăn chung | The shared table | Pirkei Avot I,5 || Pirkei Avot I, 5 | ≥2 bữa ăn chung không màn hình; mời 1 khách trong 4 tuần | At least 2 shared meals without screens; invite one guest within 4 weeks"
      - "Ôn tập: bài ca cho ngày sa-bát | Review: a song for the sabbath day | Thi thiên 92:1–5 || Psalm 92:1–5 | Cảm tạ sáng, điều tốt tối ≥5/7; chấm 6 thói quen, giữ 2, kế hoạch 4 tuần | Morning thanks and evening good things on 5 of 7 days; rate six habits, keep two, a 4-week plan"
    gioi_han: "Khóa Tầng 4, khoảng 15 phút mỗi ngày cộng một vài việc của cả nhà trong tuần; nên học sau Do Thái giáo 1. Khóa mô tả điều truyền thống Do Thái dạy về Shabbat, tzedakah và bàn ăn chung; người học không cần theo đạo. Khóa không hướng dẫn giữ luật (halakha), không hướng dẫn nghi lễ Shabbat (thắp nến, Kiddush, Havdalah), không dạy tiếng Hebrew, và không đề nghị ai đổi niềm tin. Buổi nghỉ chung, hộp chia sẻ, chừa phần và bữa ăn không màn hình là cách làm của tamhonkhoe, không phải Shabbat và không phải nghi lễ của truyền thống. Phần góp tiền không phải lời khuyên tài chính. Phần mô tả một tối thứ Sáu và tập quán trong nhà là đánh giá của người viết. Các đoạn Kinh Thánh trên trang tiếng Việt là bản tamhonkhoe tự dịch từ JPS 1917, không dịch từ tiếng Hebrew; trang tiếng Anh chép nguyên văn JPS 1917. Pirkei Avot dịch từ bản Gorfinkle (Gutenberg). Mishnah Pe'ah 1:1, Pirkei Avot III,4 và tám bậc cho đi của Maimonides chỉ được tóm ý. Chưa có người duyệt từ trong truyền thống Do Thái, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; bằng chứng trong bài chỉ là gián tiếp."
    gioi_han_en: "A Level 4 course, about 15 minutes a day plus a few family activities each week; best taken after Judaism 1. It describes what the Jewish tradition teaches about Shabbat, tzedakah and the shared table; learners do not need to be Jewish. It does not teach Jewish law (halakha) or Shabbat ritual (candles, Kiddush, Havdalah), does not teach Hebrew, and does not ask anyone to change their beliefs. The shared rest period, sharing box, setting aside and screen-free meals are tamhonkhoe's own exercises; they are not Shabbat and not rituals of the tradition. The giving exercise is not financial advice. The description of a Friday evening and of home customs is the writer's judgement. Bible passages on the Vietnamese pages are tamhonkhoe's own translations from JPS 1917, not from Hebrew; the English pages quote JPS 1917 word for word. Pirkei Avot is translated from Gorfinkle's edition (Gutenberg). Mishnah Pe'ah 1:1, Pirkei Avot III, 4 and Maimonides' eight levels of giving are only summarised. No reviewer from within the Jewish tradition has checked it yet, and no study has evaluated this programme directly; the evidence in the lessons is only indirect."

  # ------------------------------------------------------------ BẤT NHỊ
  - ma: BN1
    slug: bat-nhi-1
    slug_en: non-duality-1
    nhom: bat-nhi
    ten: "Gita và Upanishad nhập môn"
    ten_en: "Introduction to the Gita and the Upanishads"
    mo_ta: "Khóa Tầng 1 đọc chậm vài đoạn ngắn của Bhagavad Gita và Upanishad, hai loại văn bản mà nhiều truyền thống Hindu coi là kinh điển. Làm mà không bám quả (Gita 2:47), nóng lạnh đến rồi đi (2:14–15), tự nâng mình lên và làm bạn với chính mình (6:5–6), hình ảnh cỗ xe và những con ngựa (Katha Upanishad 1.3.3–6), mọi thứ được Đấng Chủ Tể bao phủ và không thèm muốn của người khác (Isha Upanishad 1, 6), người không ghét bỏ loài nào (Gita 12:13–14). Bài tập là việc nhỏ của đời thường: làm hết sức rồi buông kết quả, quan sát một khó chịu nhỏ cho tới khi nó qua, một câu động viên mỗi sáng, nhận ra một thói quen và dừng một hơi thở, đọc chậm, và một việc thân thiện với người khó."
    mo_ta_en: "A Level 1 course of slow reading in short passages from the Bhagavad Gita and the Upanishads, two kinds of text that many Hindu traditions hold as scripture. Working without clinging to fruits (Gita 2:47), heat and cold that come and go (2:14–15), raising yourself up and being your own friend (6:5–6), the image of the chariot and the horses (Katha Upanishad 1.3.3–6), all things covered by the Lord and not coveting what is another's (Isha Upanishad 1, 6), the one who hates no being (Gita 12:13–14). The exercises are small everyday ones: doing a task fully and letting go of the result, watching a small discomfort until it passes, one encouraging sentence each morning, noticing a habit and pausing for one breath, slow reading, and one friendly act towards a difficult person."
    tang: "1"
    phut: "10–15"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 6 tuần"
    tien_do_en: "All 6 weeks published"
    duyet: chu-du-an
    ra_mat: "Th11/2026"
    ra_mat_en: "Nov 2026"
    co_goc_tre: true
    nghien_cuu: [gloster2020, abramowitz2001, atjak2015, lktm2024, friese2017, lally2010, harkin2016, dittmar2014, curry2018]
    bai_tep: [khe/bat-nhi/bn1-tuan-01, khe/bat-nhi/bn1-tuan-02, khe/bat-nhi/bn1-tuan-03, khe/bat-nhi/bn1-tuan-04, khe/bat-nhi/bn1-tuan-05, khe/bat-nhi/bn1-tuan-06]
    bai:
      - "Làm mà không bám quả | Work without clinging to fruits | Gita 2:47 || Gita 2:47 | Mỗi ngày làm hết sức 1 việc rồi buông kết quả, ghi 1 dòng, ≥5/7 | One task a day done as well as you can, letting go of the result, one line written, on 5 of 7 days"
      - "Nóng lạnh qua đi | Heat and cold pass | Gita 2:14–15 || Gita 2:14–15 | Ghi 1 khó chịu nhỏ và thời gian nó qua đi, ≥5/7 | Note one small discomfort and how long it took to pass, on 5 of 7 days"
      - "Tự nâng mình | Lifting yourself up | Gita 6:5–6 || Gita 6:5–6 | 1 câu tự động viên mỗi sáng ≥5/7; đếm số câu tự chê đã đổi | One encouraging sentence each morning on 5 of 7 days; count the self-critical sentences you changed"
      - "Cỗ xe | The chariot | Katha Upanishad 1.3.3–6 || Katha Upanishad 1.3.3–6 | Quan sát 1 \"con ngựa\" (thói quen): đếm lần nhận ra và lần dừng 1 hơi thở, ≥5/7 | Watch one ‘horse’ (habit): count the times you noticed it and the times you paused for one breath, on 5 of 7 days"
      - "Tất cả được Đấng Chủ Tể bao phủ | All is covered by the Lord | Isha Upanishad 1, 6 || Isha Upanishad 1, 6 | Đọc chậm 10 phút ≥5/7; ghi 1 lần thèm muốn và 1 điều đã có | Slow reading 10 minutes on 5 of 7 days; note one moment of wanting and one thing you have"
      - "Người không ghét ai (ôn tập) | One who hates no being (review) | Gita 12:13–14 || Gita 12:13–14 | 1 lần thân thiện với người khó; chấm 6 thói quen, giữ 2, kế hoạch 4 tuần | Once, friendliness towards a difficult person; rate six habits, keep two, a 4-week plan"
    gioi_han: "Khóa Tầng 1, khoảng 10–15 phút mỗi ngày. Khóa mô tả điều Bhagavad Gita và Upanishad dạy; người học không cần theo đạo, và khóa không đề nghị ai đổi niềm tin hay sùng kính ai. Tên khe \"Bất nhị\" lấy theo một cách đọc (Advaita Vedanta); các trường phái khác như của Ramanuja, Madhva đọc cùng văn bản nhưng hiểu khác, và khóa không đứng về bên nào. Khóa không bàn về chiến tranh trong bối cảnh Gita, không dạy nghi lễ, mantra hay tiếng Sanskrit, và không bàn câu hỏi về cái chết của Katha Upanishad. Bài tập (chia \"phần của tôi\", quan sát khó chịu nhỏ, câu động viên, đếm \"con ngựa\", việc thân thiện với người khó) là cách làm của tamhonkhoe, không phải thực hành của truyền thống. \"Chịu đựng\" và \"không ghét ai\" không có nghĩa là chịu đau, bệnh hay bị người khác làm hại. Trên trang tiếng Việt, Gita là bản tamhonkhoe tự dịch từ bản thơ của Edwin Arnold (Gutenberg #2388; Arnold không đánh số câu, số câu ghép theo nội dung), Upanishad tự dịch từ bản Swami Paramananda (Gutenberg #3283); không dịch từ tiếng Sanskrit. Trang tiếng Anh chép nguyên văn hai bản này. Chưa có người duyệt từ trong truyền thống Hindu, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; bằng chứng trong bài chỉ là gián tiếp."
    gioi_han_en: "A Level 1 course, about 10–15 minutes a day. It describes what the Bhagavad Gita and the Upanishads teach; learners do not need to be Hindu, and the course does not ask anyone to change their beliefs or to be devoted to anyone. The section name \"Non-duality\" comes from one reading (Advaita Vedanta); other schools, such as those of Ramanuja and Madhva, read the same texts differently, and the course takes no side. It does not discuss war in the Gita's setting, does not teach ritual, mantras or Sanskrit, and does not discuss the Katha Upanishad's question about death. The exercises (splitting \"my part\", watching small discomforts, the encouraging sentence, counting the \"horse\", the friendly act towards a difficult person) are tamhonkhoe's own, not practices of the tradition. \"Bear with it\" and \"hating no being\" do not mean putting up with pain, illness or being harmed by others. On the Vietnamese pages the Gita is tamhonkhoe's own translation from Edwin Arnold's verse version (Gutenberg #2388; Arnold does not number verses, so verse numbers are matched by content) and the Upanishads from Swami Paramananda's version (Gutenberg #3283); nothing is translated from Sanskrit. The English pages quote these two versions word for word. No reviewer from within the Hindu tradition has checked it yet, and no study has evaluated this programme directly; the evidence in the lessons is only indirect."

  - ma: BN2
    slug: bat-nhi-2
    slug_en: non-duality-2
    nhom: bat-nhi
    ten: "Karma yoga và thiền theo Gita"
    ten_en: "Karma yoga and meditation in the Gita"
    mo_ta: "Khóa Tầng 2 đọc chương 2, 3 và 6 của Bhagavad Gita về hai con đường: hành động không tìm lợi (karma yoga) và thiền định. Bình thản trong thành bại (2:48, 2:56), không ai sống mà không hành động (3:5, 3:7–8), chỗ ngồi, tư thế và ánh mắt khi thiền (6:10–14), ăn ngủ điều độ (6:16–17), tâm khó giữ như gió và ngọn đèn trong chỗ khuất gió (6:33–34, 6:19), tập đều và buông (6:35–36, 6:26), hành động vì người khác (3:20–21), người gắng sức không mất đi (6:40). Mỗi ngày ngồi 15 phút, tăng dần lên 25 phút, theo cách Gita tả chỗ ngồi và tư thế, cùng một việc nhỏ của đời thường."
    mo_ta_en: "A Level 2 course reading chapters 2, 3 and 6 of the Bhagavad Gita on two paths: action without seeking gain (karma yoga) and meditation. Even-mindedness in success and failure (2:48, 2:56), no one lives without acting (3:5, 3:7–8), the seat, posture and gaze in meditation (6:10–14), moderation in food and sleep (6:16–17), a mind as hard to hold as the wind and the lamp sheltered from the wind (6:33–34, 6:19), steady practice and letting go (6:35–36, 6:26), acting for others (3:20–21), one who strives is not lost (6:40). Each day you sit for 15 minutes, rising to 25, following the Gita's description of seat and posture, along with one small everyday task."
    tang: "2"
    phut: "20–30"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 8 tuần"
