      - "Im lặng trước mầu nhiệm | Silence before mystery | Thần học huyền nhiệm, ch. 3 · Đám mây không biết, ch. 46 || The Mystical Theology, ch. 3 · The Cloud of Unknowing, ch. 46 | Buổi 40′ (hoặc 30′ ngồi + 10′ đi chậm) ≥5/7; 1 buổi đọc cùng 1 người | A 40′ session (or 30′ sitting + 10′ slow walking) on 5 of 7 days; one reading with another person"
      - "Ôn tập | Review | Danh xưng Thiên Chúa, ch. 1 · Thần học huyền nhiệm, ch. 5 · Đám mây không biết, ch. 6 || The Divine Names, ch. 1 · The Mystical Theology, ch. 5 · The Cloud of Unknowing, ch. 6 | Ngồi 30–40′ ≥5/7; tự chấm 6 thói quen, giữ 2, kế hoạch 4 tuần | Sit 30–40′ on 5 of 7 days; rate six habits, keep two, write a 4-week plan"
    gioi_han: "Khóa Tầng 3: mỗi ngày 30–45 phút, nên học sau Kitô giáo 1 và 2. Không dành cho người đang trầm cảm, có tang mới, đang trải qua biến cố lớn hay có ý nghĩ muốn chết; người từng có loạn thần, rối loạn lưỡng cực, PTSD nặng hay cảm giác tách khỏi bản thân kéo dài không nên tự học. Khóa chỉ đọc vài đoạn, trong khi lời mở đầu của Đám mây không biết xin người đọc đọc trọn sách và chỉ dành cho người muốn sống đời chiêm niệm; ai muốn theo con đường này nên đọc trọn sách cùng một người hướng dẫn trong truyền thống. Khóa không so sánh với cách các truyền thống khác nói về Thượng Đế, không trích các câu về ma quỷ, luyện ngục, đoạn dặn giữ kín với \"người chưa được khai tâm\" và các chú thích của người dịch. Bài tập dùng cách quay về nhẹ nhàng, không đè nén ý nghĩ, và có cách ngồi cho người không cầu nguyện (điều chỉnh của tamhonkhoe). Góc trẻ chỉ nói về những điều có thật mà không nhìn thấy hay gọi tên hết, không nói về Thượng Đế. Bản Việt là bản tamhonkhoe tự dịch từ bản Anh của Evelyn Underhill (1922) và C. E. Rolt (1920). Chưa có người duyệt từ trong truyền thống Kitô giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này."
    gioi_han_en: "A Level 3 course: 30–45 minutes a day, best taken after Christianity 1 and 2. It is not for people who are depressed, newly bereaved, going through a major upheaval or having thoughts of dying; people with a history of psychosis, bipolar disorder, severe PTSD or long-lasting feelings of being detached from themselves should not study it alone. The course reads only a few passages, while the prologue of The Cloud of Unknowing asks readers to read the whole book and keeps it for those who wish to live a contemplative life; anyone who wants to follow this path should read the whole book with a guide within the tradition. The course does not compare this with how other traditions speak of God, and does not quote the lines on fiends and purgatory, the passage on keeping these things from \"the uninitiated\", or the translator’s notes. The practice uses a gentle return rather than suppressing thoughts, and offers a way of sitting for those who do not pray (tamhonkhoe’s adaptation). The kids’ corner is only about things that are real but cannot be seen or fully named, and does not speak of God. The English quotes Evelyn Underhill (1922) and C. E. Rolt (1920). No reviewer from within the Christian tradition has checked it yet, and no study has evaluated this programme directly."

  - ma: KT4
    slug: kito-giao-4
    slug_en: christianity-4
    nhom: kito-giao
    ten: "Đức tin thành việc làm"
    ten_en: "Faith in action"
    mo_ta: "Ma-thi-ơ 25 (những người bé nhỏ nhất), thư Gia-cơ (đức tin và việc làm), Công vụ 2 (đời sống chung), Cô-lô-se 3 (làm việc hết lòng; mặc lấy lòng yêu thương), 1 Giăng 3:18, Mi-chê 6:8 và Ma-thi-ơ 6:3–4: đem đức tin vào việc làm hằng ngày cho người đang thiếu, cho cộng đoàn, trong công việc và trong gia đình. Mỗi ngày đọc 5 phút buổi sáng, làm một việc trong ngày, nhìn lại 2 phút buổi tối."
    mo_ta_en: "Matthew 25 (the least of these), James (faith and works), Acts 2 (shared life), Colossians 3 (working heartily; putting on love), 1 John 3:18, Micah 6:8 and Matthew 6:3–4: carrying faith into daily deeds for people in need, for a community, at work and in the family. Each day, 5 minutes of reading in the morning, one act during the day, 2 minutes of looking back in the evening."
