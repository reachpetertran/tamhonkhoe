    bai:
      - "Cặp đối lập | Pairs of opposites | Đạo Đức Kinh 2 || Tao Te Ching 2 | Ngồi 20′ ≥5/7; ghi 1 cặp nhãn/ngày ≥5/7 | Sit 20′ on 5 of 7 days; note one pair of labels a day on 5 of 7 days"
