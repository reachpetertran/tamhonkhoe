    gioi_han_en: "The course quotes only what the Stoic writers say about how to live; it does not quote or follow the passages where they discuss leaving life by one’s own choice. It is not for people who are newly bereaved, seriously ill or having thoughts of dying. It does not practise reminders like ‘you may not wake again’. No study has evaluated this programme directly."

