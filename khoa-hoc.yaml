    ten: "Zakat, Ramadan và đời sống"
    ten_en: "Zakat, Ramadan and daily life"
    mo_ta: "Zakat dành cho ai (Qur'an 9:60) và cho đi không kể ơn (2:262–263); tháng Ramadan và Đêm Định Mệnh (97:1–5); giữ lời nói (49:12, Bukhari 1903) và người được miễn nhịn; cha mẹ (17:23–24); láng giềng và người lỡ đường (4:36, Bukhari 6014); cho mà không mong đền ơn (76:8–9). Chỉ mô tả zakat và nhịn chay; bài tập là việc trong đời thường: một việc cho đi, đọc chậm buổi tối, giữ một thói quen lời nói, hỏi thăm cha mẹ, biết tên hàng xóm, và một bài tiết chế nhẹ tùy chọn cho người lớn khỏe mạnh."
    mo_ta_en: "Who zakat is for (Qur'an 9:60) and giving without reproach (2:262–263); the month of Ramadan and the Night of Power (97:1–5); guarding speech (49:12, Bukhari 1903) and who is exempt from fasting; parents (17:23–24); neighbours and the wayfarer (4:36, Bukhari 6014); giving without wanting thanks (76:8–9). Zakat and fasting are only described; the exercises are everyday actions: one act of giving, slow evening reading, guarding one speech habit, asking after parents, learning a neighbour's name, and an optional light restraint exercise for healthy adults."
