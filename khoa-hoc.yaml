    ten_en: "Fasting in the traditions (described)"
    mo_ta: "Ramadan, Yom Kippur, Mùa Chay, bát quan trai: đọc kinh văn, xem mỗi truyền thống nói gì về thời gian, mục đích và người được miễn. Chỉ mô tả, không hướng dẫn nhịn ăn; thực hành mỗi tuần không liên quan đến ăn uống (cho đi, sửa lỗi, việc tốt kín đáo, một buổi tối không giải trí)."
    mo_ta_en: "Ramadan, Yom Kippur, Lent and the Buddhist eight precepts: read the texts and see what each tradition says about timing, purpose and who is exempt. Described, not taught; each week's practice has nothing to do with food (giving, putting a wrong right, a good deed in secret, an evening without entertainment)."
