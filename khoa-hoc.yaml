      - "Đời ngắn | Life is short | Seneca, Thư 49 || Seneca, Letter 49 | 30 phút/ngày cho 1 điều quan trọng, ≥5/7 | 30 minutes a day for one thing that matters, on 5 of 7 days"
      - "Mọi thứ trôi qua | Everything passes | Suy tưởng II.11–12 || Meditations II.11–12 | 1 quan sát thay đổi + 1 việc trọn vẹn, ≥5/7 | One observation of change and one task done fully, on 5 of 7 days"
      - "Những người đã đi trước | Those who went before | Suy tưởng IV.48 || Meditations IV.48 | 1 thư cảm ơn không gửi + tiếp nối ≥3 ngày | One unsent thank-you letter, carrying it on for 3 days"
