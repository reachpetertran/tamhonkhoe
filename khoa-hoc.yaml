    gioi_han: "Khóa Tầng 4: không có buổi ngồi dài, chỉ đọc khoảng 10 phút mỗi ngày và tập trong việc nhà, việc làm, các mối quan hệ. Các bài kinh phản ánh xã hội Ấn Độ cổ (gia nhân, hôn nhân do cha mẹ sắp đặt, chia việc theo giới); khóa giữ ý bổn phận đi hai chiều, không giữ các cách phân vai ấy. Khóa không dùng lời kinh để khuyên ai ở lại trong một mối quan hệ có bạo lực hay kiểm soát. Phần tiền bạc chỉ mô tả lời dạy, không phải lời khuyên tài chính; khóa không xin tiền và không gợi ý cho tổ chức nào. Người học không cần tin vào tái sinh. Chưa có người duyệt từ trong truyền thống Phật giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; tuần 2 và 4 không có bằng chứng khoa học."
    gioi_han_en: "A Level 4 course: no long sitting, only about 10 minutes of reading a day and practice in housework, work and relationships. The discourses reflect ancient Indian society (bondservants, marriages arranged by parents, roles divided by gender); the course keeps the idea that duties go both ways, not those divisions of roles. The course does not use the discourses to advise anyone to stay in a relationship with violence or control. The money lessons only describe the teaching and are not financial advice; the course asks for no money and recommends no organisation. Learners do not need to believe in rebirth. No reviewer from within the Buddhist tradition has checked it yet, and no study has evaluated this programme directly; weeks 2 and 4 have no scientific evidence."

