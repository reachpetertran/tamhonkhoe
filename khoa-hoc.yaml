      - "Ngày nghỉ | The day of rest | Sáng thế 2:1–3 · Phục truyền 5:12–15 || Genesis 2:1–3 · Deuteronomy 5:12–15 | Đọc chậm ≥5/7; 1 khoảng nghỉ có chủ ý ≥90 phút, ghi 3 dòng | Slow reading on 5 of 7 days; one intentional rest of at least 90 minutes, then three lines"
      - "Nếu không phải bây giờ | If not now | Pirkei Avot I,14 || Pirkei Avot I, 14 | 1 dòng trả lời ≥5/7; làm xong 1 việc đã hoãn | One line of answer on 5 of 7 days; finish one thing put off"
      - "Không phải làm xong, nhưng không được bỏ | Not to finish, but not to quit | Pirkei Avot II,20–21 (2:15–16) || Pirkei Avot II, 20–21 (2:15–16) | 10 phút cho 1 việc dài hạn ≥5/7 | Ten minutes on one long-term task on 5 of 7 days"
      - "Công bằng, nhân hậu, khiêm tốn | Justice, kindness, humility | Mi-chê 6:6–8 || Micah 6:6–8 | 1 việc cho điều đã chọn ≥5/7; tự chấm 6 thực hành, giữ 1–2 | One action for the chosen value on 5 of 7 days; rate six practices, keep one or two"
    gioi_han: "Khóa Tầng 1, khoảng 10–15 phút mỗi ngày. Khóa mô tả điều truyền thống Do Thái dạy qua sáu đoạn ngắn trong Torah, Talmud, Pirkei Avot và sách Mi-chê; người học không cần theo đạo. Khóa không hướng dẫn giữ luật (halakha), không hướng dẫn giữ Shabbat hay nghi lễ, không dạy tiếng Hebrew, và không đề nghị ai đổi niềm tin. Các bài tập (đọc chậm, một khoảng nghỉ có chủ ý, một việc tử tế) là việc chung cho mọi người, không phải Shabbat và không thay cho việc học với thầy hay cộng đồng. Các đoạn Kinh Thánh trên trang tiếng Việt là bản tự dịch của tamhonkhoe từ bản tiếng Anh JPS 1917, không dịch từ tiếng Hebrew; trang tiếng Anh chép nguyên văn JPS 1917. Pirkei Avot dịch từ bản Gorfinkle (Gutenberg); Talmud chỉ được tóm ý. Phần mô tả tập quán là đánh giá của người viết; chưa có người duyệt từ trong truyền thống Do Thái, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; bằng chứng trong bài chỉ là gián tiếp."
    gioi_han_en: "A Level 1 course, about 10–15 minutes a day. It describes what Jewish tradition teaches through six short passages from the Torah, the Talmud, Pirkei Avot and the Book of Micah; learners do not need to be Jewish. It does not teach Jewish law (halakha), Shabbat observance or ritual, does not teach Hebrew, and does not ask anyone to change their beliefs. The exercises (slow reading, an intentional rest period, a kind act) are for anyone; they are not Shabbat and do not replace study with a teacher or a community. Bible passages on the Vietnamese pages are tamhonkhoe's own translations from the English JPS 1917, not from Hebrew; the English pages quote JPS 1917 word for word. Pirkei Avot is translated from Gorfinkle's edition (Gutenberg); the Talmud is only summarised. The descriptions of practice are the writer's judgement; no reviewer from within the Jewish tradition has checked it yet, and no study has evaluated this programme directly; the evidence in the lessons is only indirect."

  - ma: DT2
    slug: do-thai-giao-2
    slug_en: judaism-2
    nhom: do-thai-giao
    ten: "Mussar: rèn tính cách"
    ten_en: "Mussar: training character"
    mo_ta: "Mussar là truyền thống rèn tính cách (middot) của Do Thái giáo. Mỗi tuần một đức tính qua Pirkei Avot và sách Mesillat Yesharim (Luzzatto): học hỏi từ mọi người (Avot IV,1), đón người niềm nở (I,15), không vội phán xét (II,5 và I,6), tôn trọng người khác (IV,15), thận trọng và nhiệt thành (Mesillat Yesharim, chương 2 và 6), khiêm nhường (Avot IV,4; Mesillat Yesharim, chương 22), rồi ôn tập với việc \"tính sổ\" mỗi ngày (chương 3). Mỗi ngày: đọc chậm buổi sáng, một việc nhỏ của đức tính trong tuần, sổ đức tính buổi tối."
    mo_ta_en: "Mussar is Judaism's tradition of training character traits (middot). One trait a week through Pirkei Avot and Luzzatto's Mesillat Yesharim: learning from everyone (Avot IV, 1), greeting people warmly (I, 15), not judging quickly (II, 5 and I, 6), honouring others (IV, 15), watchfulness and zeal (Mesillat Yesharim, chapters 2 and 6), humility (Avot IV, 4; Mesillat Yesharim, chapter 22), then a review built on daily \"accounting\" (chapter 3). Each day: slow morning reading, one small act of the week's trait, an evening trait notebook."
    tang: "2"
    phut: "20–30"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 8 tuần"
    tien_do_en: "All 8 weeks published"
    duyet: chu-du-an
    ra_mat: "Th11/2026"
    ra_mat_en: "Nov 2026"
    co_goc_tre: true
    nghien_cuu: [harkin2016, curry2018, holtlunstad2010, gollwitzer2006, friese2017, lally2010, lee2025]
    bai_tep: [khe/do-thai-giao/dt2-tuan-01, khe/do-thai-giao/dt2-tuan-02, khe/do-thai-giao/dt2-tuan-03, khe/do-thai-giao/dt2-tuan-04, khe/do-thai-giao/dt2-tuan-05, khe/do-thai-giao/dt2-tuan-06, khe/do-thai-giao/dt2-tuan-07, khe/do-thai-giao/dt2-tuan-08]
    bai:
      - "Ai là người khôn ngoan | Who is wise | Pirkei Avot IV,1 || Pirkei Avot IV, 1 | Tự chấm 7 đức tính; 1 điều học từ 1 người ≥5/7; sổ tối ≥5/7 | Rate the seven traits; one thing learned from one person on 5 of 7 days; evening notebook on 5 of 7 days"
      - "Đón mọi người niềm nở | Greeting everyone cheerfully | Pirkei Avot I,15 || Pirkei Avot I, 15 | ≥3 lời chào trọn vẹn/ngày ≥5/7; 1 lần hứa ít làm nhiều | At least three full greetings a day on 5 of 7 days; once, promise little and do much"
      - "Đừng vội phán xét | Do not judge too quickly | Pirkei Avot II,5 (2:4) · I,6 || Pirkei Avot II, 5 (2:4) · I, 6 | 1 lần \"hai cách giải thích khác\"/ngày ≥5/7 | ‘Two other explanations’ once a day on 5 of 7 days"
      - "Tôn trọng người khác | Honouring others | Pirkei Avot IV,15 (4:12) || Pirkei Avot IV, 15 (4:12) | 1 việc tôn trọng cụ thể/ngày ≥5/7 | One specific act of respect a day on 5 of 7 days"
      - "Thận trọng | Watchfulness | Mesillat Yesharim, chương 2 || Mesillat Yesharim, chapter 2 | ≥3 điểm dừng trước thói quen/ngày ≥5/7 | At least three pauses before a habit a day on 5 of 7 days"
      - "Nhiệt thành | Zeal | Mesillat Yesharim, chương 6 || Mesillat Yesharim, chapter 6 | 1 việc tốt làm sớm ≥5/7; ghi ≥3 lời viện cớ | One good deed done early on 5 of 7 days; write down at least three excuses"
      - "Khiêm nhường | Humility | Pirkei Avot IV,4 · Mesillat Yesharim, chương 22 || Pirkei Avot IV, 4 · Mesillat Yesharim, chapter 22 | 1 việc học, nhận lỗi hoặc giúp/ngày ≥5/7 | Learn, admit a mistake or help once a day on 5 of 7 days"
      - "Ôn tập: tính sổ như người buôn | Review: keeping accounts like a merchant | Mesillat Yesharim, chương 3 || Mesillat Yesharim, chapter 3 | Sổ tối đúng giờ ≥5/7; chấm lại 7 đức tính; kế hoạch 4 tuần | Evening notebook at a fixed time on 5 of 7 days; re-rate the seven traits; a four-week plan"
    gioi_han: "Khóa Tầng 2, khoảng 20–25 phút mỗi ngày; nên học sau Do Thái giáo 1. Khóa mô tả điều truyền thống Mussar dạy về tính cách qua Pirkei Avot và sách Mesillat Yesharim; người học không cần theo đạo. Trong truyền thống, rèn đức tính gắn với việc phụng sự Thiên Chúa và giữ các điều răn; khóa không hướng dẫn giữ luật (halakha) hay nghi lễ, không dạy tiếng Hebrew, và không đề nghị ai đổi niềm tin. Bài tập (đọc chậm, một việc nhỏ mỗi ngày, sổ buổi tối) là cách làm của tamhonkhoe phỏng theo lối \"mỗi tuần một đức tính\", không thay cho việc học với thầy, bạn học hay nhóm Mussar. Bài \"không vội phán xét\" không dùng để bào chữa cho người đang gây hại; bài \"nhiệt thành\" không bớt ngủ, bớt ăn hay bớt nghỉ; bài \"khiêm nhường\" không phải tự hạ thấp mình. Pirkei Avot dịch từ bản Gorfinkle (Gutenberg); Mesillat Yesharim dịch từ bản tiếng Anh của Rabbi Yosef Sebag (Sefaria, CC BY), không dịch từ tiếng Hebrew; trang tiếng Anh chép nguyên văn hai bản này. Phần mô tả tập quán là đánh giá của người viết; chưa có người duyệt từ trong truyền thống Do Thái, và chưa có nghiên cứu đánh giá trực tiếp chương trình này; bằng chứng trong bài chỉ là gián tiếp."
    gioi_han_en: "A Level 2 course, about 20–25 minutes a day; best taken after Judaism 1. It describes what the Mussar tradition teaches about character through Pirkei Avot and Mesillat Yesharim; learners do not need to be Jewish. In the tradition, training character is bound up with serving God and keeping the commandments; the course does not teach Jewish law (halakha) or ritual, does not teach Hebrew, and does not ask anyone to change their beliefs. The exercises (slow reading, one small act a day, an evening notebook) are tamhonkhoe's own, adapted from the \"one trait a week\" approach, and do not replace study with a teacher, a study partner or a Mussar group. The lesson on not judging quickly is not for excusing someone who is causing harm; the lesson on zeal involves no less sleep, food or rest; the lesson on humility is not about putting yourself down. Pirkei Avot is translated from Gorfinkle's edition (Gutenberg); Mesillat Yesharim from Rabbi Yosef Sebag's English translation (Sefaria, CC BY), not from Hebrew; the English pages quote both word for word. The descriptions of practice are the writer's judgement; no reviewer from within the Jewish tradition has checked it yet, and no study has evaluated this programme directly; the evidence in the lessons is only indirect."

  - ma: DT3
    slug: do-thai-giao-3
    slug_en: judaism-3
    nhom: do-thai-giao
    ten: "Gióp và câu hỏi về đau khổ"
    ten_en: "Job and the question of suffering"
    mo_ta: "Đọc sáu đoạn trong sách Gióp (bản JPS 1917): phần mở đầu (chương 1–2), lời than của Gióp (7, 23), lời Ê-li-pha và lời Gióp đáp các bạn (4, 16), tiếng nói từ cơn gió lốc (38), lời đáp cuối của Gióp (42:1–6) và phần kết (42:7–11), cùng vài lời bàn của Talmud. Mỗi ngày đọc chậm và ngồi 25–30 phút; mỗi tuần một việc nhỏ: ghi câu hỏi mà không vội trả lời, viết lời than, lắng nghe không giải thích, đi bộ để ý điều lớn lao, đọc cùng một người, thăm hỏi người đang khổ. Khóa không giải thích vì sao một người cụ thể phải khổ."
    mo_ta_en: "Six passages from the Book of Job (JPS 1917): the opening (chapters 1–2), Job’s lament (7, 23), Eliphaz and Job’s reply to his friends (4, 16), the voice from the whirlwind (38), Job’s final reply (42:1–6) and the ending (42:7–11), with a few Talmud discussions. Each day, slow reading and 25–30 minutes of sitting; each week one small practice: writing a question without rushing to answer, writing a lament, listening without explaining, walking to notice something vast, reading with someone, checking in on someone who is suffering. The course does not explain why any particular person suffers."
    tang: "3"
    phut: "30–40"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 6 tuần"
