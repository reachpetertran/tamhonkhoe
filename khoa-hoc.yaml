    gioi_han: "Đăng trước khi dạy thử, theo quyết định của chủ dự án; mỗi trang ghi rõ \"chưa dạy thử\" và có mục ghi lại sau buổi chơi. Trò chơi không dạy giáo lý của tôn giáo nào. Không nhịn ăn, không ăn kiêng, không nói về sang chấn, không đưa chuyện chết chóc vào trò chơi; luôn có người lớn đi cùng. Chưa có nghiên cứu nào đo riêng các trò chơi này; nghiên cứu về chánh niệm, biết ơn và tha thứ ở trẻ là các chương trình nhiều buổi, nhiều nghiên cứu ở trẻ lớn hơn 10 tuổi. Kỹ năng cảm xúc cho trẻ 2–8 tuổi có trang gốc trên daynentang.com; ở đây chỉ đặt link."
    gioi_han_en: "Published before trial teaching, by decision of the project owner; each page says \"not yet trial-taught\" and has a section for notes after playing. The games do not teach any religion’s doctrine. No fasting, no dieting, no talk of trauma, no death in the games; always with an adult. No study has measured these particular games; research on mindfulness, gratitude and forgiveness in children involves multi-session programmes, and many studies are of children older than 10. Emotional skills for children aged 2–8 have their home on daynentang.com; we only link there."
