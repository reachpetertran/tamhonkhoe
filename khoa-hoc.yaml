    bai_tep: [khe/phat-giao/pg3-tuan-01, khe/phat-giao/pg3-tuan-02, khe/phat-giao/pg3-tuan-03, khe/phat-giao/pg3-tuan-04, khe/phat-giao/pg3-tuan-05, khe/phat-giao/pg3-tuan-06]
    bai:
      - "Đặc tính vô ngã | The characteristic of not-self | SN 22.59 | Ngồi 30′ ≥5/7; mỗi tối ghi 1 điều \"không theo ý mình\" ≥5/7 | Sit 30′ on 5 of 7 days; each evening, write one thing that ‘did not obey’ on 5 of 7 evenings"
      - "Bọt nước | The lump of foam | SN 22.95 | Ngồi 30′ ≥5/7; ghi 1 điều thấy rõ lúc bắt đầu và lúc tan ≥5/7 | Sit 30′ on 5 of 7 days; write one thing clearly seen to begin and dissolve on 5 of 7 days"
      - "Con rắn và chiếc bè | The cobra and the raft | MN 22 (đoạn 10–14) || MN 22 (sections 10–14) | Ngồi 25′ ≥5/7; viết về 1 \"chiếc bè\" ≥3 lần/tuần | Sit 25′ on 5 of 7 days; write about one ‘raft’ at least 3 times a week"
      - "Gốc rễ mọi sự | The root of all things | MN 1 | Ngồi 35′ ≥5/7; ghi 1 lần \"thêm vào\"/ngày ≥5/7 | Sit 35′ on 5 of 7 days; note one ‘adding’ a day on 5 of 7 days"
      - "Thực hành dài: buông điều không phải của mình | Longer practice: giving up what isn’t yours | MN 22 (đoạn 40–41) || MN 22 (sections 40–41) | Tập ≥40′/ngày (chia được 2 buổi) ≥5/7; ghi 1 điều nhỏ đã buông ≥5/7 | Practise at least 40′ a day (may be split) on 5 of 7 days; write one small thing let go of on 5 of 7 days"
      - "Ôn tập | Review | SN 22.59, SN 22.95, MN 22 | Ngồi 30′ ≥5/7; tự chấm 5 bài và viết kế hoạch 4 tuần | Sit 30′ on 5 of 7 days; rate the five exercises and write a 4-week plan"
    gioi_han: "Khóa Tầng 3: mỗi ngày 30–45 phút, nên học sau Phật giáo 1 và 2. Quán vô ngã có thể gây cảm giác tách khỏi bản thân hay thế giới \"không thật\"; mỗi buổi có bước \"về lại mặt đất\" và mục \"Dừng tập khi\". Người đang trầm cảm, có tang mới hay có ý nghĩ tự hại không nên học lúc này; người từng có loạn thần, rối loạn lưỡng cực, PTSD nặng hay cảm giác tách khỏi bản thân kéo dài không nên tự học. Khóa chỉ mô tả lời dạy Phật giáo, không so sánh với quan niệm về linh hồn hay tự ngã của truyền thống khác, không trích các khổ kệ về thân bị bỏ lại (SN 22.95), và không đòi người học tin vào tái sinh hay các tầng chứng đắc. Không có tonglen. Chưa có người duyệt từ trong truyền thống Phật giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này."
    gioi_han_en: "A Level 3 course: 30–45 minutes a day, best taken after Buddhism 1 and 2. Contemplating not-self can bring feelings of being detached from oneself or of the world being ‘not real’; every session ends with a ‘back to the ground’ step and every lesson has a ‘Stop practising if’ section. People who are depressed, recently bereaved or having thoughts of self-harm should not take it now; people with a history of psychosis, bipolar disorder, severe PTSD or lasting feelings of detachment should not take it alone. The course only describes Buddhist teaching, does not compare it with other traditions’ views of the soul or the self, does not quote the verses on the body left behind (SN 22.95), and does not ask learners to believe in rebirth or stages of attainment. It includes no tonglen. No reviewer from within the Buddhist tradition has checked it yet, and no study has evaluated this programme directly."

  - ma: PG4
    slug: phat-giao-4
    slug_en: buddhism-4
    nhom: phat-giao
    ten: "Pháp trong đời thường"
    ten_en: "Dhamma in everyday life"
    mo_ta: "Gia đình, nghề nghiệp, tiền bạc theo lời dạy cho người tại gia: sáu phương, tấm gương của Rāhula, cha mẹ của Nakula; khoảng 10 phút đọc mỗi ngày và một việc nhỏ trong đời thường."
    mo_ta_en: "Family, work and money in the teachings for lay people: the six directions, Rāhula's mirror, Nakula's parents; about 10 minutes of reading a day and one small action in daily life."
