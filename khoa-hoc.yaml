      - "Lòng lắng yên | A quieted soul | Thi thiên 131 || Psalm 131 | Ngồi im ≥15′ 5/7, trong đó ≥3 ngày 20′ | Sit in silence at least 15′ on 5 of 7 days, with at least 3 days at 20′"
      - "Lời cầu ngắn | A short prayer | Lc 18:9–14 || Luke 18:9–14 | Ngồi im 20′ với một câu ngắn ≥5/7 | Sit in silence 20′ with one short sentence on 5 of 7 days"
      - "Nhịp cầu nguyện trong ngày | A daily rhythm of prayer | Brother Lawrence, thư 7 · 1 Tê 5:16–18 || Brother Lawrence, Letter 7 · 1 Thessalonians 5:16–18 | Ngồi im 20′ ≥5/7; ≥2 trong 3 nhịp dừng/ngày ≥5/7 | Sit in silence 20′ on 5 of 7 days; at least 2 of 3 pauses a day on 5 of 7 days"
      - "Khô khan và kiên trì | Dryness and perseverance | Gương Chúa Giêsu II.9 · Brother Lawrence || The Imitation of Christ II.9 · Brother Lawrence | Ngồi im 20′ ≥5/7, kể cả ngày khô; ghi nhãn mỗi buổi | Sit in silence 20′ on 5 of 7 days, dry days included; label each sitting"
      - "Ôn tập | Review | Brother Lawrence, thư 6 || Brother Lawrence, Letter 6 | Ngồi im 25′ ≥5/7; tự chấm 7 thói quen, giữ 2, kế hoạch 4 tuần | Sit in silence 25′ on 5 of 7 days; rate seven habits, keep two, write a 4-week plan"
    gioi_han: "Khóa Tầng 2: mỗi ngày 20–30 phút, phần ngồi im tăng dần tới 25 phút; nên học sau Kitô giáo 1. Khóa mô tả cách cầu nguyện của truyền thống Kitô giáo; người học không cần theo đạo, và mỗi bài có cách ngồi im cho người không cầu nguyện, là điều chỉnh của tamhonkhoe chứ không phải hình thức của truyền thống. Bản Việt của Brother Lawrence và Gương Chúa Giêsu là bản tamhonkhoe tự dịch từ bản Anh phạm vi công cộng; Kinh Thánh dùng nguyên văn bản 1925, có sửa một chữ lỗi mã hóa ở Thi thiên 131:1 và ghi rõ. Khóa không dạy cách thở của truyền thống Kinh Chúa Giêsu, không dạy kiêng khem hay \"việc lao khổ\", và không dùng lời \"Thiên Chúa thử lòng\" để giải thích bệnh tật, bạo lực hay mất mát. Ngồi im lâu có thể gây trải nghiệm khó chịu; mỗi bài có mục \"Dừng tập khi\", Tuần 7 có phần phân biệt khô khan với trầm cảm, và người từng có loạn thần, rối loạn lưỡng cực hay PTSD nặng nên hỏi bác sĩ trước. Chưa có người duyệt từ trong truyền thống Kitô giáo, và chưa có nghiên cứu tổng hợp riêng về cầu nguyện chiêm niệm; bằng chứng trong bài chỉ là gián tiếp."
    gioi_han_en: "A Level 2 course: 20–30 minutes a day, with the silent part growing to 25 minutes; best taken after Christianity 1. The course describes how the Christian tradition prays; learners do not need to be Christian, and each lesson offers a way of sitting in silence for those who do not pray, which is tamhonkhoe’s adaptation rather than a form of the tradition. The English pages quote Brother Lawrence (Project Gutenberg #13871), The Imitation of Christ (Benham) and the World English Bible, all public domain. The course does not teach the breathing method of the Jesus Prayer tradition, does not teach abstinence or ‘severe labours’, and does not use ‘God tries our love’ to explain illness, violence or loss. Long silent sitting can bring difficult experiences; every lesson has a ‘Stop practising if’ section, Week 7 explains how dryness differs from depression, and people with a history of psychosis, bipolar disorder or severe PTSD should ask a doctor first. No reviewer from within the Christian tradition has checked it yet, and there is no review of contemplative prayer as such; the evidence in the lessons is only indirect."

  - ma: KT3
    slug: kito-giao-3
    slug_en: christianity-3
    nhom: kito-giao
    ten: "Thượng Đế vượt khái niệm"
    ten_en: "God beyond concepts"
    mo_ta: "Sách Đám mây không biết (thế kỷ 14) và Thần học huyền nhiệm của tác giả lấy tên Dionysius: truyền thống chiêm niệm Kitô giáo nói rằng trí hiểu không nắm được Thiên Chúa, chỉ tình yêu hướng về Ngài. Mỗi ngày ngồi im 25–40 phút: không cố hình dung, để ý nghĩ đi qua, quay về một chữ ngắn, đặt xuống một hình ảnh, và tập nhẹ nhàng không gồng ép."
    mo_ta_en: "The Cloud of Unknowing (14th century) and The Mystical Theology by the author writing as Dionysius: the Christian contemplative tradition teaches that understanding cannot grasp God, only love turned towards Him. Each day, 25–40 minutes of silent sitting: not trying to picture anything, letting thoughts pass, returning to one short word, setting down an image, and practising gently without straining."
