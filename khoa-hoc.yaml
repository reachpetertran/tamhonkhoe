    gioi_han: "Khóa Tầng 2: mỗi ngày ngồi 20–30 phút, nên học sau Phật giáo 1. Thiền dài hơn có thể gây trải nghiệm khó chịu; mỗi bài có mục \"Dừng tập khi\", và người từng có loạn thần, rối loạn lưỡng cực hay PTSD nặng nên hỏi bác sĩ trước. Khóa không tập quán 31 bộ phận của thân, quán tử thi (MN 10) và cách thứ năm \"dùng tâm khống chế tâm\" (MN 20). Khóa trình bày phần thực hành, không đòi người học chấp nhận niềm tin về tái sinh hay các tầng chứng đắc. Chưa có người duyệt từ trong truyền thống Phật giáo, và chưa có nghiên cứu đánh giá trực tiếp chương trình này."
    gioi_han_en: "A Level 2 course: 20–30 minutes of sitting a day, best taken after Buddhism 1. Longer meditation can bring difficult experiences; every lesson has a ‘Stop practising if’ section, and people with a history of psychosis, bipolar disorder or severe PTSD should ask a doctor first. The course does not practise contemplating the 31 parts of the body or corpses (MN 10), or the fifth approach of ‘crushing mind with mind’ (MN 20). It presents the practice and does not ask learners to accept beliefs about rebirth or stages of attainment. No reviewer from within the Buddhist tradition has checked it yet, and no study has evaluated this programme directly."

