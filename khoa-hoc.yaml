      - "Người làm cùng ta | The people who work with us | Seneca, Thư 47 || Seneca, Letter 47 | 1 hành động thấy người làm cùng như một con người/ngày, ≥5/7 | One action a day that treats someone you work with as a person, on 5 of 7 days"
