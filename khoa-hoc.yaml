# Khung chương trình tamhonkhoe.com – dữ liệu cho trang /khoa-hoc/ và /en/courses/.
# Nguồn: docs/nghien-cuu/ (nghiên cứu 04/11/2026). Vị trí câu kinh: Peter đã đối chiếu 04/11/2026.
#
# Mỗi dòng bài:  "Tên VI | Tên EN | Kinh VI || Kinh EN | Mục tiêu VI | Mục tiêu EN"
#   - "|| Kinh EN" bỏ trống nếu giống bản Việt; mục tiêu có thể bỏ trống.
# duyet (mức đăng, xem README "Nguyên tắc đăng"):
#   chu-du-an   = ít nhạy cảm, đăng thẳng khi chủ dự án duyệt
#   truyen-thong = cần người duyệt từ trong truyền thống (Giao thoa: 2 người, 2 truyền thống)
#   noi-bo      = giữ ở khu nội bộ (Tầng 3, nhịn ăn chi tiết...)
# trang_thai: dang-mo | dang-soan | chua-bat-dau
# Không ghi nhãn "cần kiểm chứng" (dạng có ngoặc vuông) ở đây: build public sẽ dừng.

nhom:
  - {id: giao-thoa, ten: "Giao thoa", ten_en: "Convergence",
     mo_ta: "Những thực hành nhiều truyền thống cùng có. Mỗi tuần ba đoạn kinh từ ba truyền thống, và một mục \"Nơi các truyền thống khác nhau\".",
     mo_ta_en: "Practices that many traditions share. Each week has three passages from three traditions and a section on where the traditions differ."}
  - {id: khac-ky, ten: "Khắc kỷ", ten_en: "Stoicism", mo_ta: "Epictetus, Seneca, Marcus Aurelius.", mo_ta_en: "Epictetus, Seneca, Marcus Aurelius."}
  - {id: phat-giao, ten: "Phật giáo", ten_en: "Buddhism", mo_ta: "Kinh Pali qua bản dịch của Bhikkhu Sujato (CC0).", mo_ta_en: "Pali suttas in Bhikkhu Sujato’s translation (CC0)."}
  - {id: kito-giao, ten: "Kitô giáo", ten_en: "Christianity", mo_ta: "Kinh Thánh, Brother Lawrence, Gương Chúa Giêsu, Đám mây không biết, Dionysius.", mo_ta_en: "The Bible, Brother Lawrence, The Imitation of Christ, The Cloud of Unknowing, Dionysius."}
  - {id: hoi-giao, ten: "Hồi giáo", ten_en: "Islam", mo_ta: "Qur'an và hadith, trình bày từ góc người tìm hiểu, không hướng dẫn nghi lễ.", mo_ta_en: "The Qur'an and hadith, presented for learners, not as ritual instruction."}
  - {id: do-thai-giao, ten: "Do Thái giáo", ten_en: "Judaism", mo_ta: "Torah, Talmud, Pirkei Avot.", mo_ta_en: "Torah, Talmud, Pirkei Avot."}
  - {id: bat-nhi, ten: "Bất nhị / Hiện diện", ten_en: "Non-duality / Presence", mo_ta: "Upanishad và Bhagavad Gita.", mo_ta_en: "The Upanishads and the Bhagavad Gita."}
  - {id: dao-giao, ten: "Đạo giáo", ten_en: "Taoism", mo_ta: "Đạo Đức Kinh và Trang Tử, đọc như văn bản Đạo gia; không dạy nghi lễ.", mo_ta_en: "The Tao Te Ching and Zhuangzi, read as Taoist texts; no ritual instruction."}
  - {id: than-the, ten: "Thân thể", ten_en: "Body", mo_ta: "Ăn uống và vận động như một thực hành. Kỷ luật ăn chỉ là lựa chọn tùy ý cho người lớn khỏe mạnh.", mo_ta_en: "Eating and movement as practice. Eating disciplines are only an optional choice for healthy adults."}
  - {id: goc-tre, ten: "Góc trẻ 6+", ten_en: "Kids’ corner 6+", mo_ta: "Hoạt động 5–10 phút, luôn có người lớn đi cùng.", mo_ta_en: "5–10 minute activities, always with an adult."}

nghien_cuu:
  dunning2019:
    trich: "Dunning et al. 2019, Journal of Child Psychology and Psychiatry 60(3)"
    url: "https://doi.org/10.1111/jcpp.12980"
    vi: "Phân tích gộp 33 thử nghiệm ngẫu nhiên, 3.666 trẻ em và thanh thiếu niên: chương trình chánh niệm cải thiện chú ý, lo âu/căng thẳng, trầm cảm ở mức nhỏ (d 0,16–0,30); so với nhóm đối chứng có hoạt động khác, chỉ còn lợi ích về chánh niệm, trầm cảm, lo âu/căng thẳng."
    en: "Meta-analysis of 33 randomised trials, 3,666 children and adolescents: mindfulness programmes improved attention, anxiety/stress and depression by a small amount (d 0.16–0.30); against active controls, benefits remained only for mindfulness, depression and anxiety/stress."
  froh2008:
    trich: "Froh, Sefick & Emmons 2008, Journal of School Psychology 46(2)"
    url: "https://doi.org/10.1016/j.jsp.2007.03.005"
    vi: "221 học sinh đầu tuổi thiếu niên, 11 lớp chia ngẫu nhiên: viết điều đáng biết ơn đi kèm biết ơn, lạc quan, hài lòng cuộc sống cao hơn, ít cảm xúc tiêu cực hơn; rõ nhất là hài lòng với trường học."
    en: "221 early adolescents, 11 classes randomly assigned: writing down things to be grateful for went with more gratitude, optimism and life satisfaction and less negative feeling; clearest for satisfaction with school."
  aknin2012:
    trich: "Aknin, Hamlin & Dunn 2012, PLoS ONE 7(6)"
    url: "https://doi.org/10.1371/journal.pone.0039211"
    vi: "Trẻ chưa đầy 2 tuổi trông vui hơn khi cho người khác đồ ăn vặt so với khi tự nhận, và vui hơn nữa khi cho chính phần của mình. Một nghiên cứu nhỏ, đo một lần."
    en: "Children under 2 looked happier giving treats to others than receiving them, and happier still when giving their own. One small study, measured once."
  rapp2022:
    trich: "Rapp, Wang Xu & Enright 2022, Child Development 93(5)"
    url: "https://doi.org/10.1111/cdev.13771"
    vi: "Phân tích gộp 20 nghiên cứu, 1.472 trẻ em và thanh thiếu niên (tuổi trung bình khoảng 12): chương trình giáo dục về tha thứ tăng tha thứ (g = 0,54) và giảm giận (g = 0,29)."
    en: "Meta-analysis of 20 studies, 1,472 children and adolescents (mean age about 12): forgiveness education programmes increased forgiveness (g = 0.54) and reduced anger (g = 0.29)."
  goyal2014:
    trich: "Goyal et al. 2014, JAMA Internal Medicine 174(3)"
    url: "https://doi.org/10.1001/jamainternmed.2013.13018"
    vi: "47 thử nghiệm ngẫu nhiên, 3.515 người: chương trình thiền chánh niệm giảm lo âu, trầm cảm ở mức nhỏ đến vừa; không tốt hơn các can thiệp chủ động khác."
    en: "47 randomised trials, 3,515 people: mindfulness meditation programmes reduce anxiety and depression by a small-to-moderate amount; not better than other active treatments."
  vandam2018:
    trich: "Van Dam et al. 2018, Perspectives on Psychological Science 13(1)"
    url: "https://doi.org/10.1177/1745691617709589"
    vi: "Tổng quan phê bình: \"chánh niệm\" chưa có định nghĩa thống nhất, nhiều nghiên cứu yếu về phương pháp và dựa nhiều vào tự báo cáo, tác dụng không mong muốn chưa được theo dõi đủ."
    en: "Critical review: \"mindfulness\" has no agreed definition, many studies are methodologically weak and rely heavily on self-report, and adverse effects are not monitored enough."
  farias2020:
    trich: "Farias et al. 2020, Acta Psychiatrica Scandinavica 142(5)"
    url: "https://doi.org/10.1111/acps.13225"
    vi: "Tổng quan 83 nghiên cứu: khoảng 8% người tập thiền gặp trải nghiệm bất lợi (khoảng 4% trong nghiên cứu thực nghiệm), thường là lo âu, trầm cảm; có thể xảy ra cả ở người chưa có tiền sử bệnh tâm thần."
    en: "Review of 83 studies: about 8% of meditators reported an adverse experience (about 4% in experimental studies), most often anxiety or depression; it can happen to people with no history of mental illness."
  cregg2021:
    trich: "Cregg & Cheavens 2021, Journal of Happiness Studies 22(1)"
    url: "https://doi.org/10.1007/s10902-020-00236-6"
    vi: "27 nghiên cứu, 3.675 người: bài tập biết ơn giảm triệu chứng trầm cảm, lo âu ở mức nhỏ; nhỏ hơn khi so với nhóm đối chứng tích cực."
    en: "27 studies, 3,675 people: gratitude exercises reduce depression and anxiety symptoms by a small amount; less so against active control groups."
  curry2018:
    trich: "Curry et al. 2018, Journal of Experimental Social Psychology 76"
    url: "https://www.sciencedirect.com/science/article/pii/S0022103117303451"
    vi: "27 nghiên cứu thực nghiệm, 4.045 người: làm việc tử tế tăng cảm giác hạnh phúc ở mức nhỏ đến vừa; các nghiên cứu thường nhỏ."
    en: "27 experiments, 4,045 people: acts of kindness raise well-being by a small-to-moderate amount; the studies are often small."
  friese2017:
    trich: "Friese et al. 2017, Perspectives on Psychological Science 12(6)"
    url: "https://doi.org/10.1177/1745691617697076"
    vi: "33 nghiên cứu về luyện tự kiểm soát: hiệu quả nhỏ, và còn nhỏ hơn sau khi hiệu chỉnh sai lệch xuất bản."
    en: "33 studies of self-control training: a small effect, smaller still after correcting for publication bias."
  wendsche2017:
    trich: "Wendsche & Lohmann-Haislah 2017, Frontiers in Psychology 7"
    url: "https://doi.org/10.3389/fpsyg.2016.02072"
    vi: "38.124 người lao động: người tách được khỏi công việc lúc nghỉ ít kiệt sức hơn, ngủ tốt hơn. Đây là tương quan."
    en: "38,124 workers: people who detach from work when off duty report less exhaustion and better sleep. This is a correlation."
  jenkinson2013:
    trich: "Jenkinson et al. 2013, BMC Public Health 13:773"
    url: "https://doi.org/10.1186/1471-2458-13-773"
    vi: "5 nghiên cứu đoàn hệ: người làm tình nguyện có nguy cơ tử vong thấp hơn. Đây là tương quan; thử nghiệm ngẫu nhiên chưa cho thấy lợi ích rõ."
    en: "5 cohort studies: volunteers had lower mortality. This is a correlation; randomised trials have not shown clear benefit."
  wade2014:
    trich: "Wade et al. 2014, Journal of Consulting and Clinical Psychology 82(1)"
    url: "https://doi.org/10.1037/a0035268"
    vi: "53 nghiên cứu, 2.323 người: chương trình tha thứ có hướng dẫn tăng mức tha thứ rõ rệt so với không can thiệp, và giảm trầm cảm, lo âu; chương trình dài hơn hiệu quả hơn."
    en: "53 studies, 2,323 people: guided forgiveness programmes clearly increase forgiveness compared with no treatment, and reduce depression and anxiety; longer programmes work better."
  lktm2024:
    trich: "Wang et al. 2024, Stress and Health 40(1)"
    url: "https://doi.org/10.1002/smi.3273"
    vi: "21 thử nghiệm: giảm kiệt sức và căng thẳng, tăng lòng tự từ bi; các nghiên cứu khác nhau nhiều."
    en: "21 trials: lower burnout and stress, higher self-compassion; results vary a lot between studies."
  lee2025:
    trich: "Lee et al. 2025, The Counseling Psychologist 53(6)"
    url: "https://doi.org/10.1177/00110000251352566"
    vi: "65 nghiên cứu: khiêm nhường đi kèm sức khỏe tinh thần tốt hơn một chút (liên hệ nhỏ). Đây là tương quan. Chưa có phân tích gộp về chương trình luyện khiêm nhường."
    en: "65 studies: humility goes with slightly better mental health (small associations). This is a correlation. There is no meta-analysis of humility training yet."
  frattaroli2006:
    trich: "Frattaroli 2006, Psychological Bulletin 132(6)"
    url: "https://doi.org/10.1037/0033-2909.132.6.823"
    vi: "146 nghiên cứu ngẫu nhiên về viết ra trải nghiệm và cảm xúc: hiệu quả chung dương tính nhưng rất nhỏ (r = 0,075)."
    en: "146 randomised studies of writing about experiences and feelings: a positive but very small overall effect (r = 0.075)."
  karl2022:
    trich: "Karl et al. 2022, Journal of Happiness Studies 23(7)"
    url: "https://doi.org/10.1007/s10902-022-00563-w"
    vi: "Nghiên cứu có đăng ký trước, 1.307 người ở 3 nước: cách hiểu phổ biến nhưng sai về Khắc kỷ (muốn ít bộc lộ cảm xúc, muốn cảm thấy ít đi) đi kèm mức hạnh phúc thấp hơn. Đây là tương quan."
    en: "Pre-registered study, 1,307 people in 3 countries: a popular but mistaken reading of Stoicism (wanting to show fewer emotions and to feel less) went with lower well-being. This is a correlation."
  gloster2020:
    trich: "Gloster et al. 2020, Journal of Contextual Behavioral Science 18"
    url: "https://doi.org/10.1016/j.jcbs.2020.09.009"
    vi: "Tổng quan 20 phân tích gộp: liệu pháp chấp nhận và cam kết (ACT) hiệu quả với lo âu, trầm cảm, đau mạn tính; ngang liệu pháp nhận thức hành vi. Đây là trị liệu có hướng dẫn."
    en: "Review of 20 meta-analyses: Acceptance and Commitment Therapy (ACT) works for anxiety, depression and chronic pain, about as well as CBT. This is guided therapy."
  atjak2015:
    trich: "A-Tjak et al. 2015, Psychotherapy and Psychosomatics 84(1)"
    url: "https://doi.org/10.1159/000365764"
    vi: "39 thử nghiệm ngẫu nhiên, 1.821 người: ACT tốt hơn nhóm đối chứng (g = 0,57), không khác biệt rõ so với liệu pháp nhận thức hành vi."
    en: "39 randomised trials, 1,821 people: ACT did better than control conditions (g = 0.57), with no clear difference from CBT."
  dunn2008:
    trich: "Dunn, Aknin & Norton 2008, Science 319(5870)"
    url: "https://doi.org/10.1126/science.1150952"
    vi: "Khảo sát, theo dõi và một thí nghiệm ngẫu nhiên: tiêu tiền cho người khác đi kèm, và trong thí nghiệm làm tăng, cảm giác hạnh phúc. Phần khảo sát là tương quan; một nhóm nghiên cứu."
    en: "A survey, a follow-up and a randomised experiment: spending money on others went with, and in the experiment raised, happiness. The survey part is a correlation; one research group."
  goncalves2015:
    trich: "Gonçalves et al. 2015, Psychological Medicine 45(14)"
    url: "https://doi.org/10.1017/S0033291715001166"
    vi: "Phân tích gộp thử nghiệm ngẫu nhiên: can thiệp tôn giáo/tâm linh giảm lo âu; chương trình rất khác nhau, chất lượng nghiên cứu còn hạn chế."
    en: "Meta-analysis of randomised trials: religious/spiritual interventions reduce anxiety; programmes vary widely and study quality is limited."
  captari2018:
    trich: "Captari et al. 2018, Journal of Clinical Psychology 74(11)"
    url: "https://doi.org/10.1002/jclp.22681"
    vi: "97 nghiên cứu, 7.181 người: trị liệu có lồng niềm tin của thân chủ giảm căng thẳng ngang trị liệu thông thường và tăng hạnh phúc tâm linh. Chưa có nghiên cứu tổng hợp riêng về lectio divina."
    en: "97 studies, 7,181 people: therapy that integrates the client’s faith reduces distress as well as standard therapy and adds spiritual well-being. There is no review of lectio divina itself."
  semnani2025:
    trich: "Semnani-Azad et al. 2025, BMJ 389:e082007"
    url: "https://doi.org/10.1136/bmj-2024-082007"
    vi: "99 thử nghiệm ngẫu nhiên, 6.582 người lớn (đa số thừa cân hay có bệnh): nhịn ăn gián đoạn giảm cân tương tự ăn bớt năng lượng mỗi ngày; ăn trong khung giờ (như 16:8) không hơn; không khác về HbA1c."
    en: "99 randomised trials, 6,582 adults (most with overweight or illness): intermittent fasting gives weight loss similar to daily calorie restriction; time-restricted eating (such as 16:8) is no better; no difference in HbA1c."
  koch2023:
    trich: "Koch et al. 2023, European Heart Journal 44(28)"
    url: "https://doi.org/10.1093/eurheartj/ehad211"
    vi: "30 thử nghiệm ngẫu nhiên: ăn chay hoặc thuần chay giảm cholesterol toàn phần, LDL-cholesterol và apolipoprotein B so với ăn tạp; không khác về triglyceride. Đo mỡ máu, không đo sức khỏe tinh thần."
    en: "30 randomised trials: vegetarian or vegan diets lowered total cholesterol, LDL cholesterol and apolipoprotein B compared with an omnivorous diet; no difference in triglycerides. Measures blood fats, not mental health."
  lowe2020:
    trich: "Lowe et al. 2020, JAMA Internal Medicine 180(11)"
    url: "https://doi.org/10.1001/jamainternmed.2020.4153"
    vi: "Thử nghiệm ngẫu nhiên 12 tuần, 116 người thừa cân hay béo phì: ăn trong khung 16:8 không giảm cân hơn ăn 3 bữa đúng giờ; nhóm 16:8 mất nhiều khối nạc hơn."
    en: "12-week randomised trial, 116 adults with overweight or obesity: a 16:8 eating window gave no more weight loss than three regular meals; the 16:8 group lost more lean mass."
  liu2022:
    trich: "Liu et al. 2022, NEJM 386(16)"
    url: "https://doi.org/10.1056/NEJMoa2114833"
    vi: "Thử nghiệm ngẫu nhiên 12 tháng, 139 người béo phì: thêm khung giờ ăn 8 tiếng vào chế độ ăn bớt năng lượng không giảm cân, mỡ hay chỉ số chuyển hóa hơn chỉ ăn bớt."
    en: "12-month randomised trial, 139 people with obesity: adding an 8-hour eating window to calorie restriction did not reduce weight, fat or metabolic markers more than calorie restriction alone."
  iguacel2021:
    trich: "Iguacel et al. 2021, Nutrition Reviews 79(4)"
    url: "https://doi.org/10.1093/nutrit/nuaa030"
    vi: "13 nghiên cứu quan sát: kết quả trái chiều về ăn chay và tâm trạng. Đây là tương quan; khoa học chưa cho thấy ăn chay cải thiện tâm trạng."
    en: "13 observational studies: mixed results on vegetarian diets and mood. This is a correlation; science has not shown that a vegetarian diet improves mood."
  berthelot2021:
    trich: "Berthelot et al. 2021, Nutrients 13(11)"
    url: "https://doi.org/10.3390/nu13113947"
    vi: "11 nghiên cứu, 1.436 người, về các kiểu nhịn ăn nói chung: trong các thử nghiệm ngẫu nhiên ít nguy cơ sai lệch, nhóm nhịn ăn có điểm lo âu, trầm cảm thấp hơn nhóm chứng. Tác giả gọi kết quả là sơ bộ; chưa có nghiên cứu ở người có bệnh tâm thần."
    en: "11 studies, 1,436 people, on fasting interventions in general: in randomised trials at low risk of bias, fasting groups had lower anxiety and depression scores than controls. The authors call the results preliminary; no study included people with psychiatric conditions."
  heun2018:
    trich: "Heun 2018, Global Psychiatry 1(1)"
    url: "https://doi.org/10.2478/gp-2018-0002"
    vi: "Tổng quan 22 bài: tác động của Ramadan lên sức khỏe tinh thần nhìn chung nhỏ, nhưng người mắc tâm thần phân liệt hoặc rối loạn lưỡng cực có nguy cơ tái phát cao hơn."
    en: "Review of 22 papers: Ramadan’s effect on mental health is generally small, but people with schizophrenia or bipolar disorder have a higher risk of relapse."
  pinquart2012:
    trich: "Pinquart & Forstmeier 2012, Aging & Mental Health 16(5)"
    url: "https://doi.org/10.1080/13607863.2011.651434"
    vi: "128 thử nghiệm có đối chứng về hồi tưởng, ôn lại đời mình: giảm trầm cảm (g = 0,57) và tăng cảm giác trọn vẹn về đời mình (g = 0,64) ở mức vừa; phần lớn ở người lớn tuổi, có người hướng dẫn."
    en: "128 controlled trials of reminiscence and life review: moderate reductions in depression (g = 0.57) and gains in ego-integrity (g = 0.64); mostly older adults, with guidance."
  burke2010:
    trich: "Burke, Martens & Faucher 2010, Personality and Social Psychology Review 14(2)"
    url: "https://doi.org/10.1177/1088868309352321"
    vi: "Phân tích gộp 277 thí nghiệm trong phòng thí nghiệm: khi được nhắc tới cái chết, người ta bảo vệ quan điểm và lòng tự trọng mạnh hơn (r = 0,35)."
    en: "Meta-analysis of 277 laboratory experiments: when reminded of death, people defended their views and self-esteem more strongly (r = 0.35)."
  klein2022:
    trich: "Klein et al. 2022, Collabra: Psychology 8(1)"
    url: "https://doi.org/10.1525/collabra.35271"
    vi: "Dự án lặp lại ở 17 phòng thí nghiệm, 1.550 người: không lặp lại được hiệu ứng kinh điển của việc nhắc tới cái chết trong điều kiện nào."
    en: "Replication project in 17 laboratories, 1,550 people: the classic effect of reminding people of death was not reproduced under any condition."
  lundorff2017:
    trich: "Lundorff et al. 2017, Journal of Affective Disorders 212"
    url: "https://doi.org/10.1016/j.jad.2017.01.030"
    vi: "14 nghiên cứu trên người lớn có người thân mất (không do bạo lực): khoảng 9,8% có nguy cơ rối loạn tang kéo dài; phương pháp các nghiên cứu khác nhau nhiều."
    en: "14 studies of bereaved adults (non-violent loss): about 9.8% were at risk of prolonged grief disorder; methods varied widely."
  kjaervik2024:
    trich: "Kjærvik & Bushman 2024, Clinical Psychology Review 109"
    url: "https://doi.org/10.1016/j.cpr.2024.102414"
    vi: "Phân tích gộp 154 nghiên cứu, 10.189 người: hoạt động làm dịu cơ thể (thở chậm, chánh niệm, thư giãn) giảm giận dữ và gây hấn ở mức vừa (g = −0,63); hoạt động làm hưng phấn (đấm bao cát, chạy bộ để xả giận) nhìn chung không hiệu quả."
    en: "Meta-analysis of 154 studies, 10,189 people: activities that calm the body (slow breathing, mindfulness, relaxation) reduced anger and aggression moderately (g = −0.63); arousal-raising activities (hitting a punch bag, running to let off steam) were ineffective overall."

  khoury2015:
    trich: "Khoury et al. 2015, Journal of Psychosomatic Research 78(6)"
    url: "https://doi.org/10.1016/j.jpsychores.2015.03.009"
    vi: "Phân tích gộp 29 nghiên cứu, 2.668 người khỏe mạnh: chương trình MBSR giảm căng thẳng, lo âu, trầm cảm ở mức vừa (so giữa nhóm g = 0,53); các nghiên cứu khác nhau nhiều."
    en: "Meta-analysis of 29 studies, 2,668 healthy adults: the MBSR programme reduced stress, anxiety and depression moderately (between-group g = 0.53); studies varied widely."
  hilton2017:
    trich: "Hilton et al. 2017, Annals of Behavioral Medicine 51(2)"
    url: "https://doi.org/10.1007/s12160-016-9844-2"
    vi: "38 thử nghiệm ngẫu nhiên về thiền chánh niệm cho người đau mạn tính: giảm đau ở mức nhỏ (30 thử nghiệm), bằng chứng chất lượng thấp; trầm cảm và chất lượng sống cũng cải thiện."
    en: "38 randomised trials of mindfulness meditation for chronic pain: a small decrease in pain (30 trials), low-quality evidence; depression and quality of life also improved."
  wei2025:
    trich: "Wei et al. 2025, BMC Psychology 13"
    url: "https://doi.org/10.1186/s40359-025-03348-x"
    vi: "Phân tích gộp 29 thử nghiệm ngẫu nhiên, 2.535 người: liệu pháp nhận thức dựa trên chánh niệm (MBCT) giảm nghiền ngẫm ở mức vừa (SMD = −0,51), còn ở lần theo dõi sau."
    en: "Meta-analysis of 29 randomised trials, 2,535 people: mindfulness-based cognitive therapy (MBCT) reduced rumination moderately (SMD = −0.51), with effects held at follow-up."
  abramowitz2001:
    trich: "Abramowitz, Tolin & Street 2001, Clinical Psychology Review 21(5)"
    url: "https://doi.org/10.1016/S0272-7358(00)00057-X"
    vi: "Phân tích gộp các nghiên cứu có đối chứng: cố đè nén một ý nghĩ làm nó quay lại nhiều hơn, ở mức nhỏ đến vừa; mức này thay đổi theo loại ý nghĩ và cách đo."
    en: "Meta-analysis of controlled studies: trying to suppress a thought makes it come back more often, by a small-to-moderate amount; the effect varied with the kind of thought and how it was measured."
  kuyken2016:
    trich: "Kuyken et al. 2016, JAMA Psychiatry 73(6)"
    url: "https://doi.org/10.1001/jamapsychiatry.2016.0076"
    vi: "Phân tích gộp dữ liệu từng bệnh nhân, 9 thử nghiệm, 1.258 người có trầm cảm tái phát đang thuyên giảm: MBCT giảm nguy cơ tái phát trong 60 tuần (HR 0,69 so với không MBCT; 0,79 so với điều trị chủ động khác)."
    en: "Individual patient data meta-analysis, 9 trials, 1,258 people with recurrent depression in remission: MBCT reduced relapse risk over 60 weeks (HR 0.69 vs no MBCT; 0.79 vs other active treatments)."
  bernstein2015:
    trich: "Bernstein et al. 2015, Perspectives on Psychological Science 10(5)"
    url: "https://doi.org/10.1177/1745691615594577"
    vi: "Tổng quan phê bình về \"lùi ra khỏi trải nghiệm\" (decentering) và các khái niệm gần nó như gỡ dính khỏi ý nghĩ: đề xuất ba quá trình (biết mình đang trải nghiệm gì, không đồng nhất mình với trải nghiệm bên trong, ít bị cuốn theo nội dung ý nghĩ). Bài phân tích khái niệm, không đo hiệu quả."
    en: "Critical review of \"decentering\" and related constructs such as cognitive defusion: proposes three processes (meta-awareness, disidentification from internal experience, reduced reactivity to thought content). A conceptual analysis, not a test of effectiveness."
  lindahl2017:
    trich: "Lindahl et al. 2017, PLoS ONE 12(5)"
    url: "https://doi.org/10.1371/journal.pone.0176239"
    vi: "Nghiên cứu phỏng vấn người tập thiền Phật giáo phương Tây và các thầy: 59 loại trải nghiệm liên quan tới thiền trong 7 nhóm, có nhóm \"cảm nhận về bản thân\"; mức ảnh hưởng từ nhẹ, thoáng qua tới nặng, kéo dài; 26 nhóm yếu tố ảnh hưởng."
    en: "Interview study of Western Buddhist meditators and teachers: 59 kinds of meditation-related experience in 7 domains, including \"sense of self\"; impact ranged from minimal and passing to severe and lasting; 26 categories of influencing factors."
  robinson2013:
    trich: "Robinson et al. 2013, The American Journal of Clinical Nutrition 97(4)"
    url: "https://doi.org/10.3945/ajcn.112.045245"
    vi: "Phân tích gộp 24 nghiên cứu thực nghiệm: ăn khi bị phân tâm làm ăn nhiều hơn ở mức vừa trong bữa (SMD 0,39) và nhiều hơn ở bữa sau (SMD 0,76); nhớ rõ bữa vừa ăn làm bữa sau ăn ít hơn."
    en: "Meta-analysis of 24 experimental studies: eating while distracted increased intake moderately in that meal (SMD 0.39) and more at a later meal (SMD 0.76); remembering the meal reduced later intake."
  robinson2014:
    trich: "Robinson et al. 2014, The American Journal of Clinical Nutrition 100(1)"
    url: "https://doi.org/10.3945/ajcn.113.081745"
    vi: "Phân tích gộp 22 nghiên cứu: ăn chậm đi kèm ăn ít hơn trong bữa (SMD 0,45); cảm giác đói cuối bữa và đến 3,5 giờ sau không khác; các nghiên cứu khác nhau nhiều."
    en: "Meta-analysis of 22 studies: eating slowly went with lower intake in the meal (SMD 0.45); hunger at the end of the meal and up to 3.5 hours later did not differ; studies varied widely."
  hammons2011:
    trich: "Hammons & Fiese 2011, Pediatrics 127(6)"
    url: "https://doi.org/10.1542/peds.2010-1440"
    vi: "Phân tích gộp 17 nghiên cứu, 182.836 trẻ em và thanh thiếu niên: ăn cùng gia đình từ 3 bữa/tuần trở lên đi kèm thói quen ăn lành mạnh hơn và ít hành vi ăn uống rối loạn hơn (tương quan)."
    en: "Meta-analysis of 17 studies, 182,836 children and adolescents: 3 or more family meals a week went with healthier eating and less disordered eating (correlational)."
  singh2023:
    trich: "Singh et al. 2023, British Journal of Sports Medicine 57(18)"
    url: "https://doi.org/10.1136/bjsports-2022-106195"
    vi: "Tổng quan gộp 97 tổng quan hệ thống (1.039 thử nghiệm, 128.119 người lớn): chương trình tăng vận động giảm trầm cảm (cỡ hiệu quả trung vị −0,43), lo âu (−0,42) so với chăm sóc thông thường; cường độ cao hơn đi kèm cải thiện nhiều hơn; hiệu quả nhỏ dần ở chương trình dài hơn; phần lớn tổng quan chất lượng rất thấp."
    en: "Overview of 97 systematic reviews (1,039 trials, 128,119 adults): physical activity programmes reduced depression (median effect size −0.43) and anxiety (−0.42) compared with usual care; higher intensity went with larger gains; effects were smaller in longer programmes; most reviews were of critically low quality."
  hanson2015:
    trich: "Hanson & Jones 2015, British Journal of Sports Medicine 49(11)"
    url: "https://doi.org/10.1136/bjsports-2014-094157"
    vi: "Phân tích gộp 42 nghiên cứu, 1.843 người lớn trong nhóm đi bộ ngoài trời: huyết áp tâm thu giảm khoảng 3,7 mmHg, nhịp tim lúc nghỉ giảm, điểm trầm cảm giảm (SMD −0,67); không ghi nhận tác dụng phụ đáng kể; phần lớn so sánh trước–sau, không có nhóm chứng."
    en: "Meta-analysis of 42 studies, 1,843 adults in outdoor walking groups: systolic blood pressure about 3.7 mmHg lower, lower resting heart rate, lower depression scores (SMD −0.67); no notable side effects; mostly before–after comparisons without a control group."
  paluch2022:
    trich: "Paluch et al. 2022, The Lancet Public Health 7(3)"
    url: "https://doi.org/10.1016/S2468-2667%2821%2900302-9"
    vi: "Phân tích gộp 15 nhóm đoàn hệ, 47.471 người lớn: đi nhiều bước hơn mỗi ngày đi kèm nguy cơ tử vong thấp hơn, chững lại ở khoảng 6.000–8.000 bước (từ 60 tuổi) và 8.000–10.000 bước (dưới 60 tuổi); tương quan."
    en: "Meta-analysis of 15 cohorts, 47,471 adults: more daily steps went with a lower risk of death, levelling off at about 6,000–8,000 steps (aged 60+) and 8,000–10,000 steps (under 60); correlational."
  phoobangkerdphol2022:
    trich: "Phoobangkerdphol et al. 2022, Clinical Rehabilitation 36(4)"
    url: "https://doi.org/10.1177/02692155211068232"
    vi: "Thử nghiệm ngẫu nhiên, 68 người cao tuổi từng té ngã: đi thiền 20–30 phút/ngày trong 24 tuần cải thiện thăng bằng ngang với tập thăng bằng thông thường; hai nhóm không khác nhau; không có biến cố nghiêm trọng."
    en: "Randomised trial, 68 older adults who had fallen: walking meditation 20–30 minutes a day for 24 weeks improved balance about as much as standard balance training; the groups did not differ; no serious adverse events."

  macnamara2014:
    trich: "Macnamara, Hambrick & Oswald 2014, Psychological Science 25(8)"
    url: "https://doi.org/10.1177/0956797614535810"
    vi: "Phân tích gộp 88 nghiên cứu, hơn 11.000 người: luyện tập có chủ đích giải thích khoảng 26% khác biệt thành tích trong trò chơi trí tuệ, 21% âm nhạc, 18% thể thao, 4% học tập, dưới 1% nghề nghiệp. Phần lớn là tương quan."
    en: "Meta-analysis of 88 studies, more than 11,000 people: deliberate practice explained about 26% of the differences in performance in games, 21% in music, 18% in sports, 4% in education and less than 1% in professions. Mostly correlational."
  gollwitzer2006:
    trich: "Gollwitzer & Sheeran 2006, Advances in Experimental Social Psychology 38"
    url: "https://doi.org/10.1016/S0065-2601%2806%2938002-1"
    vi: "Phân tích gộp 94 kiểm định độc lập, hơn 8.000 người: kế hoạch dạng \"nếu… thì…\" giúp đạt mục tiêu nhiều hơn chỉ có ý định, ở mức vừa đến lớn (d = 0,65); mục tiêu và cách đo rất khác nhau."
    en: "Meta-analysis of 94 independent tests, more than 8,000 people: \"if… then…\" plans helped people reach goals more than intentions alone, by a medium-to-large amount (d = 0.65); goals and measures varied widely."
  dittmar2014:
    trich: "Dittmar, Bond, Hurst & Kasser 2014, Journal of Personality and Social Psychology 107(5)"
    url: "https://doi.org/10.1037/a0037409"
    vi: "Phân tích gộp 753 hệ số từ 259 mẫu độc lập: người đặt nặng tiền bạc, của cải có mức hạnh phúc thấp hơn một chút (r = −0,19 với thang đo giá trị và niềm tin vật chất). Đây là tương quan."
    en: "Meta-analysis of 753 effect sizes from 259 independent samples: people who put more weight on money and possessions reported slightly lower well-being (r = −0.19 for measures of materialist values and beliefs). This is a correlation."
  rohde2024:
    trich: "Rohde, Goldy, Graziosi, Ferguson, Thrul & Yaden 2024, BMC Psychology 12(1)"
    url: "https://doi.org/10.1186/s40359-024-01836-0"
    vi: "Thử nghiệm ngẫu nhiên trực tuyến, 702 người tự nhận là Kitô hữu, 28 ngày: Cầu nguyện hướng tâm có lời dẫn tôn giáo, cùng cách tập không có lời dẫn tôn giáo, và chỉ nhìn lại ngày của mình. Mức an lành ở thước đo chính một tuần sau không khác nhau giữa ba nhóm; cả ba nhóm đều tăng so với lúc đầu. Lời dẫn tôn giáo chỉ làm khác các thước đo về trải nghiệm tâm linh."
    en: "Online randomised trial, 702 self-identified Christians, 28 days: Centering Prayer with a religious framing, the same practice without it, and simply reflecting on the day. Well-being on the main measure one week later did not differ between the three groups; all three improved from the start. The religious framing changed only measures of spiritual experience."
  holtlunstad2010:
    trich: "Holt-Lunstad, Smith & Layton 2010, PLoS Medicine 7(7)"
    url: "https://doi.org/10.1371/journal.pmed.1000316"
    vi: "Phân tích gộp 148 nghiên cứu, 308.849 người: người có các mối quan hệ xã hội mạnh hơn có khả năng sống sót cao hơn trong thời gian theo dõi (OR = 1,50). Đây là tương quan."
    en: "Meta-analysis of 148 studies, 308,849 people: those with stronger social relationships were more likely to survive over the follow-up period (OR = 1.50). This is a correlation."
  pega2021:
    trich: "Pega et al. 2021, Environment International 154 (ước tính chung WHO/ILO)"
    url: "https://doi.org/10.1016/j.envint.2021.106595"
    vi: "Ước tính chung của WHO và ILO: năm 2016 khoảng 488 triệu người làm từ 55 giờ/tuần trở lên; khoảng 745.000 ca tử vong do bệnh tim thiếu máu cục bộ và đột quỵ được quy cho việc làm quá giờ. Đây là ước tính mô hình dựa trên các tổng quan hệ thống."
    en: "Joint WHO/ILO estimates: in 2016 about 488 million people worked 55 or more hours a week; about 745,000 deaths from ischemic heart disease and stroke were attributed to such long hours. These are model estimates built on systematic reviews."
  mir2026:
    trich: "Mir et al. 2026, Cambridge Prisms: Global Mental Health 13"
    url: "https://doi.org/10.1017/gmh.2026.10245"
    vi: "Phân tích gộp dữ liệu từng người của 3 thử nghiệm, 266 người (Thổ Nhĩ Kỳ, Pakistan, Anh): trị liệu hoạt hóa hành vi có điều chỉnh theo đức tin cho người Hồi giáo (BA-M) giảm điểm trầm cảm PHQ-9 nhiều hơn trị liệu thường khoảng 2,7 điểm, người bệnh theo trị liệu đều hơn. Số người còn ít; đây là trị liệu có chuyên gia."
    en: "Patient-level meta-analysis of 3 trials, 266 people (Turkey, Pakistan, UK): faith-adapted behavioural activation for Muslims (BA-M) reduced PHQ-9 depression scores by about 2.7 points more than standard treatment, with better retention. Still small; a therapist-led treatment."
  pettigrew2006:
    trich: "Pettigrew & Tropp 2006, Journal of Personality and Social Psychology 90(5)"
    url: "https://doi.org/10.1037/0022-3514.90.5.751"
    vi: "Phân tích gộp 515 nghiên cứu, 713 mẫu độc lập: tiếp xúc giữa các nhóm người thường làm giảm định kiến, lan ra cả nhóm kia; nghiên cứu chặt chẽ hơn cho kết quả rõ hơn."
    en: "Meta-analysis of 515 studies, 713 independent samples: contact between groups typically reduces prejudice, extending to the whole other group; more rigorous studies show clearer effects."
  lally2010:
    trich: "Lally, van Jaarsveld, Potts & Wardle 2010, European Journal of Social Psychology 40(6)"
    url: "https://doi.org/10.1002/ejsp.674"
    vi: "96 người tự chọn một việc nhỏ làm mỗi ngày trong 12 tuần (82 người đủ số liệu): việc dần thành tự động sau 18 tới 254 ngày tùy người; bỏ lỡ một lần không ảnh hưởng đáng kể. Nghiên cứu nhỏ, tự báo cáo."
    en: "96 people each chose a small daily action for 12 weeks (82 with enough data): it became automatic after 18 to 254 days depending on the person; missing one occasion did not materially affect this. Small study, self-reported."
  harkin2016:
    trich: "Harkin et al. 2016, Psychological Bulletin 142(2)"
    url: "https://doi.org/10.1037/bul0000025"
    vi: "Phân tích gộp 138 nghiên cứu ngẫu nhiên, 19.951 người: các cách giúp người ta theo dõi tiến bộ của mình làm tăng khả năng đạt mục tiêu ở mức nhỏ đến vừa (d = 0,40); hiệu quả lớn hơn khi kết quả được ghi ra giấy hoặc nói cho người khác biết. Nghiên cứu đo mục tiêu hành vi, không đo tính cách."
    en: "Meta-analysis of 138 randomised studies, 19,951 people: interventions that help people monitor their progress made them more likely to reach their goals, by a small-to-medium amount (d = 0.40); the effect was larger when progress was physically recorded or reported to others. It measured behavioural goals, not character."
  anovasconcelles2005:
    trich: "Ano & Vasconcelles 2005, Journal of Clinical Psychology 61(4)"
    url: "https://doi.org/10.1002/jclp.20049"
    vi: "Phân tích gộp 49 nghiên cứu (105 hệ số) về cách dựa vào niềm tin tôn giáo khi gặp chuyện khó: cách \"tích cực\" (tìm chỗ dựa nơi Thượng Đế, nơi cộng đồng) đi kèm thích nghi tốt hơn (r = 0,33); cách \"tiêu cực\" (như cảm thấy bị Thượng Đế trừng phạt) đi kèm thích nghi kém hơn (r = 0,22). Đây là tương quan."
    en: "Meta-analysis of 49 studies (105 effect sizes) on drawing on religious faith in hard times: \"positive\" forms (seeking support from God or a community) went with better adjustment (r = 0.33); \"negative\" forms (such as feeling punished by God) went with poorer adjustment (r = 0.22). These are correlations."
  sturm2022:
    trich: "Sturm et al. 2022, Emotion 22(5)"
    url: "https://doi.org/10.1037/emo0000876"
    vi: "Thử nghiệm ngẫu nhiên, 60 người lớn tuổi khỏe mạnh, mỗi tuần đi bộ ngoài trời 15 phút trong 8 tuần: nhóm được hướng dẫn để ý điều làm mình kinh ngạc (awe) có nhiều cảm xúc hướng về người khác hơn và ít căng thẳng hơn trong đời sống hằng ngày so với nhóm đi bộ thường. Nghiên cứu nhỏ."
    en: "Randomised trial, 60 healthy older adults, a 15-minute outdoor walk each week for 8 weeks: the group taught to notice awe reported more prosocial emotions and less daily distress than the group taking ordinary walks. A small study."

khoa:
  # ------------------------------------------------------------ GIAO THOA
  - ma: GT0
    slug: giao-thoa-0
    slug_en: convergence-0
    nhom: giao-thoa
    ten: "Giao thoa 0: Sáu thói quen chung"
    ten_en: "Convergence 0: Six shared habits"
    mo_ta: "Dừng lại, biết ơn, Quy tắc Vàng, kỷ luật, nghỉ ngơi, phục vụ. Mỗi bài ba đoạn kinh từ ba truyền thống."
    mo_ta_en: "Pausing, gratitude, the Golden Rule, discipline, rest and service. Each lesson has three passages from three traditions."
    tang: "1"
    phut: "10–15"
    trang_thai: dang-mo
    tien_do: "Đã lên trang đủ 6 tuần"
    tien_do_en: "All 6 weeks published"
    duyet: chu-du-an
    ra_mat: "Th11–12/2026"
    ra_mat_en: "Nov–Dec 2026"
    nghien_cuu: [goyal2014, cregg2021, curry2018, friese2017, wendsche2017, jenkinson2013]
    bai_tep: [giao-thoa/tuan-01, giao-thoa/tuan-02, giao-thoa/tuan-03, giao-thoa/tuan-04, giao-thoa/tuan-05, giao-thoa/tuan-06]
    bai:
      - "Dừng lại | Pause | MN 10 · Thi thiên 46:10 · Epictetus (Long) || MN 10 · Psalm 46:10 · Epictetus (Long) | Dừng lại ít nhất 1 lần/ngày, ≥5/7 ngày | Pause at least once a day, on 5 of 7 days"
