# Danh mục nguồn kinh điển và giấy phép – tamhonkhoe.com
#
# QUY TẮC
# - checked_on: Peter tự mở link, đọc trang giấy phép, chụp màn hình rồi mới ghi ngày (YYYY-MM-DD).
#   Nguồn có checked_on trống thì build.py KHÔNG cho bài dùng nguồn đó lên public.
# - license: PD | CC0 | CC-BY | CC-BY-NC | NO-MODIFY | COPYRIGHTED
# - may_translate: true chỉ khi giấy phép cho phép tự dịch/sửa (PD, CC0, CC-BY, CC-BY-NC).
# - chi_link: true khi nguồn chỉ được đặt link, không được trích dù ngắn (build.py chặn mọi khối kinh dùng nguồn này).
# - url_status: ghi chú Claude đã mở thử link hay chưa. Đây KHÔNG thay cho checked_on.
# - Nguồn có checked_on: Peter đã xác nhận (03/11 tự chụp; 04/11 qua ảnh Claude chụp trong giay-phep/2026-11-04/).
#   Nguồn chưa có checked_on: chưa xác nhận.

